  // 스타디움 조명 빔 (양옆에서 비추는 효과)
  const lightT = (Math.sin(now * 0.0008) + 1) / 2;
  const beamGrad1 = ctx.createLinearGradient(0, 0, W, H);
  beamGrad1.addColorStop(0, `rgba(120, 200, 255, ${0.15 + lightT * 0.05})`);
  beamGrad1.addColorStop(0.4, 'rgba(120, 200, 255, 0)');
  ctx.fillStyle = beamGrad1;
  ctx.fillRect(0, 0, W, H * 0.7);

  // === 빙판 (하단) ===
  const iceY = H * 0.52;
  // 빙판 그라데이션 (원근감)
  const iceGrad = ctx.createLinearGradient(0, iceY, 0, H);
  iceGrad.addColorStop(0, '#a8c4e5');
  iceGrad.addColorStop(0.3, '#d4e2f2');
  iceGrad.addColorStop(1, '#f0f6fc');
  ctx.fillStyle = iceGrad;
  ctx.fillRect(0, iceY, W, H - iceY);

  // 빙판 반사 (스타디움 빛이 빙판에 비치는 효과)
  const iceReflect = ctx.createLinearGradient(0, iceY, 0, iceY + 100);
  iceReflect.addColorStop(0, 'rgba(120, 200, 255, 0.25)');
  iceReflect.addColorStop(1, 'rgba(120, 200, 255, 0)');
  ctx.fillStyle = iceReflect;
  ctx.fillRect(0, iceY, W, 100);

  // === 골 크리스 (반원 푸른 페인트 영역) ===
  const goalY = iceY - 30; // 골대 바닥 라인
  const creaseR = 110;
  // 푸른 페인트 채움
  ctx.fillStyle = 'rgba(77, 159, 255, 0.35)';
  ctx.beginPath();
  ctx.arc(W/2, goalY, creaseR, 0, Math.PI, false);
  ctx.closePath();
  ctx.fill();
  // 빨강 외곽선
  ctx.strokeStyle = '#cc1f3a';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(W/2, goalY, creaseR, 0, Math.PI, false);
  ctx.stroke();
  // 골 라인 (반원 연결)
  ctx.beginPath();
  ctx.moveTo(0, goalY);
  ctx.lineTo(W/2 - creaseR, goalY);
  ctx.moveTo(W/2 + creaseR, goalY);
  ctx.lineTo(W, goalY);
  ctx.stroke();

  // 빙판 갈린 자국 (작은 디테일)
  if (!STATE.shootIceScratches) {
    STATE.shootIceScratches = [];
    for (let i=0; i<25; i++) {
      STATE.shootIceScratches.push({
        x: Math.random() * W,
        y: iceY + 20 + Math.random() * (H - iceY - 40),
        len: 15 + Math.random() * 30,
        angle: (Math.random() - 0.5) * 0.5,
      });
    }
  }
  for (const sc of STATE.shootIceScratches) {
    ctx.strokeStyle = `rgba(140, 180, 220, 0.4)`;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(sc.x, sc.y);
    ctx.lineTo(sc.x + Math.cos(sc.angle) * sc.len, sc.y + Math.sin(sc.angle) * sc.len);
    ctx.stroke();
  }

  // === 좌/우 영역 분할 표시 (준비 완료 후 항상) ===
  if (sh.ready && !sh.locked) {
    const isHolding = sh.holdStart > 0;
    const leftAlpha = !isHolding ? 0.08 : (sh.side === 'left' ? 0.28 : 0.04);
    ctx.fillStyle = `rgba(100, 180, 255, ${leftAlpha})`;
    ctx.fillRect(0, iceY + 30, W/2, H - iceY - 30);
    const rightAlpha = !isHolding ? 0.08 : (sh.side === 'right' ? 0.28 : 0.04);
    ctx.fillStyle = `rgba(255, 180, 100, ${rightAlpha})`;
    ctx.fillRect(W/2, iceY + 30, W/2, H - iceY - 30);
    // 구분선
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 3;
    ctx.setLineDash([14, 10]);
    ctx.beginPath();
    ctx.moveTo(W/2, iceY + 30);
    ctx.lineTo(W/2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    if (isHolding) {
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#0a1228';
      ctx.lineWidth = 5;
      ctx.font = '900 38px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';
      // 좌측
      ctx.fillStyle = sh.side === 'left' ? '#4d9fff' : 'rgba(120, 160, 200, 0.4)';
      if (sh.side === 'left') ctx.strokeText('◄ LEFT', W/4, iceY + 80);
      ctx.fillText('◄ LEFT', W/4, iceY + 80);
      // 우측
      ctx.fillStyle = sh.side === 'right' ? '#ff9a4d' : 'rgba(200, 160, 120, 0.4)';
      if (sh.side === 'right') ctx.strokeText('RIGHT ►', W*3/4, iceY + 80);
      ctx.fillText('RIGHT ►', W*3/4, iceY + 80);
      ctx.textAlign = 'start';
    }
  }

  // === 골대 (입체적) ===
  drawGoalNet(W/2, goalY, sh);

  // === 골리 (좌우 움직임) ===
  const goalieCenter = W/2;
  const goalieMaxOffset = 130;
  let goalieX, goalieY;
  if (sh.locked && sh.result) {
    const lockedNorm = Math.sin(sh.goalieT * Math.PI * 2) * CFG.GOALIE_RANGE_RATIO;
    goalieX = goalieCenter + lockedNorm * goalieMaxOffset;
    goalieY = goalY - 8;
    if (sh.animPhase === 'miss') {
      const t = Math.min(1, (now - sh.animStart) / 1500);
      const dive = sh.result.side === 'left' ? -45 : 45;
      goalieX += dive * Math.sin(t * Math.PI);
      goalieY += Math.sin(t * Math.PI) * 25;
    }
    if (sh.animPhase === 'goal') {
      const t = Math.min(1, (now - sh.animStart) / 2000);
      goalieY += t * 50;
    }
  } else {
    const norm = Math.sin(sh.goalieT * Math.PI * 2) * CFG.GOALIE_RANGE_RATIO;
    goalieX = goalieCenter + norm * goalieMaxOffset;
    goalieY = goalY - 8;
  }
  drawGoalie(goalieX, goalieY, sh);

  // === 골 라이트 (골인 시 점등) ===
  if (sh.animPhase === 'goal') {
    const lightPulse = Math.sin(now * 0.025) > 0;
    if (lightPulse) {
      ctx.save();
      // 골대 양쪽 위 빨간 라이트
      const lightGrad = ctx.createRadialGradient(W/2, goalY - 120, 0, W/2, goalY - 120, 300);
      lightGrad.addColorStop(0, 'rgba(255, 30, 50, 0.7)');
      lightGrad.addColorStop(0.5, 'rgba(255, 30, 50, 0.3)');
      lightGrad.addColorStop(1, 'rgba(255, 30, 50, 0)');
      ctx.fillStyle = lightGrad;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  // === 퍽 ===
  let puckX = W/2, puckY = H * 0.85;
  if (sh.animPhase === 'puckFly') {
    const t = (now - sh.animStart) / 700;
    const targetX = sh.result.side === 'left' ? W/2 - creaseR * 0.7 : W/2 + creaseR * 0.7;
    puckX = W/2 + (targetX - W/2) * t;
    puckY = H * 0.85 + (goalY - 10 - H * 0.85) * t;
  } else if (sh.animPhase === 'goal') {
    const targetX = sh.result.side === 'left' ? W/2 - creaseR * 0.7 : W/2 + creaseR * 0.7;
    puckX = targetX;
    puckY = goalY - 30;
  } else if (sh.animPhase === 'miss') {
    puckX = goalieX;
    puckY = goalieY - 5;
  }

  // 퍽 트레일 (날아갈 때)
  if (sh.animPhase === 'puckFly') {
    const t = (now - sh.animStart) / 700;
    const targetX = sh.result.side === 'left' ? W/2 - creaseR * 0.7 : W/2 + creaseR * 0.7;
    for (let i=1; i<=6; i++) {
      const trailT = Math.max(0, t - i * 0.05);
      const tx = W/2 + (targetX - W/2) * trailT;
      const ty = H * 0.85 + (goalY - 10 - H * 0.85) * trailT;
      const alpha = (1 - i/7) * 0.6;
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.beginPath();
      ctx.ellipse(tx, ty, 22 - i*2, 7 - i*0.5, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // 퍽 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.ellipse(puckX + 4, puckY + 14, 24, 7, 0, 0, Math.PI*2);
  ctx.fill();
  // 퍽 본체 (두꺼운 외곽선)
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(puckX, puckY, 26, 9, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.fillStyle = '#3a3a3a';
  ctx.beginPath();
  ctx.ellipse(puckX, puckY - 1.5, 26, 4, 0, 0, Math.PI*2);
  ctx.fill();

  // === 게이지 (준비 완료 후 항상) ===
  if (sh.ready && !sh.locked) {
    drawGaugeHorizontal(sh.value, sh.value > CFG.SHOOT_JACKPOT_ZONE);
  }

  // === 안내 텍스트 ===
  if (sh.ready && !sh.locked) {
    if (sh.holdStart === 0) {
      // 메인 안내 (두꺼운 외곽선 닌텐도 스타일)
      drawComicText(W/2, H * 0.52, 'FAKE THE GOALIE', 40, '#ffd700', '#0a1228', 5);
      ctx.font = '500 14px "Noto Sans KR", sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.textAlign = 'center';
      ctx.fillText('HOLD ANY SIDE · RELEASE TO SHOOT', W/2, H * 0.57);
      // 펄스 화살표
      const pulse = (Math.sin(now * 0.005) + 1) / 2;
      ctx.fillStyle = `rgba(255, 215, 0, ${0.6 + pulse * 0.4})`;
      ctx.font = '900 32px sans-serif';
      ctx.fillText('▼', W/4, H * 0.7);
      ctx.fillText('▼', W*3/4, H * 0.7);
      ctx.textAlign = 'start';
    } else {
      drawComicText(W/2, H * 0.93, 'RELEASE NOW!', 24, '#ffd700', '#0a1228', 4);
    }
  }

  // === 상단 점수 (HUD 카드 스타일) ===
  ctx.save();
  ctx.fillStyle = 'rgba(5, 8, 22, 0.85)';
  roundRect(20, 100, 130, 50, 14);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  roundRect(20, 100, 130, 50, 14);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '700 9px "Noto Sans KR", sans-serif';
  ctx.fillText('SCORE', 32, 118);
  ctx.fillStyle = '#00d4ff';
  ctx.font = '900 22px "Noto Sans KR", sans-serif';
  ctx.fillText(STATE.score, 32, 140);
  ctx.restore();

  // === 우측 상단 라운드 인디케이터 ===
  ctx.save();
  const indY = 125;
  const indSpacing = 28;
  const indStartX = W - 20 - (CFG.SHOOT_ROUNDS - 1) * indSpacing - 10;
  // 라벨
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '700 9px "Noto Sans KR", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('ROUND ' + STATE.shootRound + '/' + CFG.SHOOT_ROUNDS, W - 20, indY - 18);
  // 원 3개
  for (let i = 0; i < CFG.SHOOT_ROUNDS; i++) {
    const cx = indStartX + i * indSpacing;
    const cy = indY;
    const isPast = i < STATE.shootRound - 1; // 완료된 라운드
    const isCurrent = i === STATE.shootRound - 1; // 현재 진행
    let color;
    if (isPast || isCurrent) {
      color = '#00d4ff'; // 파랑
    } else {
      color = 'rgba(255,255,255,0.18)'; // 회색
    }
    // 글로우 (현재 라운드만)
    if (isCurrent) {
      ctx.shadowColor = '#00d4ff';
      ctx.shadowBlur = 12;
    } else {
      ctx.shadowBlur = 0;
    }
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, 11, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 외곽선
    ctx.strokeStyle = isPast || isCurrent ? '#0080cc' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 11, 0, Math.PI*2);
    ctx.stroke();

    // 완료된 라운드 점수 표시
    if (isPast && STATE.shootRoundScores[i] !== undefined) {
      ctx.fillStyle = STATE.shootRoundScores[i] > 0 ? '#ffd700' : 'rgba(255,255,255,0.5)';
      ctx.font = '900 9px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(STATE.shootRoundScores[i] > 0 ? '+' + STATE.shootRoundScores[i] : '0', cx, cy + 24);
    }
  }
  ctx.textAlign = 'start';
  ctx.restore();
}

// 골대 (입체적, 닌텐도 풍)
function drawGoalNet(cx, baseY, sh) {
  const goalW = 340;
  const goalH = 140;
  const goalLeft = cx - goalW / 2;
  const goalTop = baseY - goalH;
  const depth = 50; // 골대 깊이감

  const now = performance.now();
  let netShake = 0;
  if (sh.animPhase === 'goal') {
    netShake = Math.sin((now - sh.animStart) * 0.03) * 10;
  }

  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // === 골대 깊이 (안쪽 어두운 배경) ===
  // 사다리꼴 모양 (안쪽으로 좁아짐)
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.beginPath();
  ctx.moveTo(goalLeft + 12, goalTop + 12);
  ctx.lineTo(goalLeft + goalW - 12, goalTop + 12);
  ctx.lineTo(goalLeft + goalW - 8, baseY - 8);
  ctx.lineTo(goalLeft + 8, baseY - 8);
  ctx.closePath();
  ctx.fill();

  // === 그물 패턴 (다이아몬드/육각 그물) ===
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(goalLeft + 12, goalTop + 12);
  ctx.lineTo(goalLeft + goalW - 12, goalTop + 12);
  ctx.lineTo(goalLeft + goalW - 8, baseY - 8);
  ctx.lineTo(goalLeft + 8, baseY - 8);
  ctx.closePath();
  ctx.clip();

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
  ctx.lineWidth = 1.2;
  // 다이아몬드 그물 (X자 + V자 패턴)
  const netSize = 14;
  for (let row = 0; row < 12; row++) {
    for (let col = -1; col < 25; col++) {
      const offsetX = (row % 2) * (netSize / 2);
      const x = goalLeft + col * netSize + offsetX + netShake * 0.5;
      const y = goalTop + 12 + row * netSize;
      if (y > baseY) break;
      // 다이아몬드 그리기
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + netSize/2, y + netSize/2);
      ctx.lineTo(x, y + netSize);
      ctx.lineTo(x - netSize/2, y + netSize/2);
      ctx.closePath();
      ctx.stroke();
    }
  }
  ctx.restore();

  // === 골대 프레임 (빨강, 두꺼운 외곽선) ===
  ctx.fillStyle = '#cc1f3a';
  ctx.strokeStyle = '#7a0f1f';
  ctx.lineWidth = 2.5;

  // 왼쪽 기둥
  roundRect(goalLeft - 8 + netShake, goalTop - 4, 14, goalH + 8, 4);
  ctx.fill();
  ctx.stroke();
  // 오른쪽 기둥
  roundRect(goalLeft + goalW - 6 + netShake, goalTop - 4, 14, goalH + 8, 4);
  ctx.fill();
  ctx.stroke();
  // 상단 크로스바
  roundRect(goalLeft - 8 + netShake, goalTop - 4, goalW + 14, 14, 4);
  ctx.fill();
  ctx.stroke();

  // 하이라이트 (광택)
  ctx.fillStyle = 'rgba(255, 100, 130, 0.6)';
  ctx.fillRect(goalLeft - 6 + netShake, goalTop - 2, 5, goalH);
  ctx.fillRect(goalLeft + goalW - 4 + netShake, goalTop - 2, 5, goalH);
  ctx.fillRect(goalLeft - 6 + netShake, goalTop - 2, goalW + 10, 5);

  // 골대 바닥 페그 (얼음에 꽂힌 부분, 양 끝)
  ctx.fillStyle = '#7a0f1f';
  ctx.fillRect(goalLeft - 14 + netShake, baseY - 4, 22, 8);
  ctx.fillRect(goalLeft + goalW - 8 + netShake, baseY - 4, 22, 8);

  // 골인 시 골대 흔들기 후 빛
  if (sh.animPhase === 'goal') {
    ctx.shadowColor = '#ff3050';
    ctx.shadowBlur = 24;
    ctx.strokeStyle = '#ff3050';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(goalLeft - 10 + netShake, goalTop - 6, goalW + 18, goalH + 12);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

// 가로형 게이지 (슈팅 미션 전용)
function drawGaugeHorizontal(value, isJackpot) {
  const gx = W / 2;
  const gy = 60;
  const gw = W * 0.7;
  const gh = 28;
  const now = performance.now();

  // 배경
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(gx - gw/2, gy - gh/2, gw, gh);

  // 컬러 존
  const zones = [
    [0, 50, '#444'],
    [50, 80, '#cc9900'],
    [80, 95, '#cc5500'],
    [95, 100, now % 200 < 100 ? '#ff0000' : '#aa0000'],
  ];
  for (const [from, to, col] of zones) {
    ctx.fillStyle = col;
    const x1 = gx - gw/2 + (from/100) * gw;
    const x2 = gx - gw/2 + (to/100) * gw;
    ctx.fillRect(x1, gy - gh/2, x2 - x1, gh);
  }

  // 잔상 (왕복 시각화)
  const sh = STATE.shoot;
  for (let i = 1; i <= 5; i++) {
    const trailT = i * 18;
    const speed = (sh.value > CFG.SHOOT_JACKPOT_ZONE) ? CFG.SHOOT_JACKPOT_MULT : 1;
    const baseSpeed = 100 / (CFG.SHOOT_PERIOD_MS / 2 / 1000);
    const deltaV = baseSpeed * speed * (trailT/1000) * sh.dir;
    let trailV = sh.value - deltaV;
    if (trailV < 0) trailV = -trailV;
    if (trailV > 100) trailV = 200 - trailV;
    trailV = Math.max(0, Math.min(100, trailV));
    const alpha = (1 - i/6) * 0.5;
    const trailX = gx - gw/2 + (trailV/100) * gw;
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(trailX, gy, 5 + (1 - i/6) * 4, 0, Math.PI*2);
    ctx.fill();
  }

  // 외곽선
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeRect(gx - gw/2, gy - gh/2, gw, gh);

  // 현재 화살표
  const arrowX = gx - gw/2 + (value/100) * gw;
  ctx.save();
  ctx.shadowColor = '#ffff00';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#ffff00';
  ctx.beginPath();
  ctx.moveTo(arrowX, gy - gh/2 - 5);
  ctx.lineTo(arrowX - 10, gy - gh/2 - 22);
  ctx.lineTo(arrowX + 10, gy - gh/2 - 22);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 숫자
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 8;
  ctx.fillText(Math.round(value), arrowX, gy + 50);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'start';

  // 눈금
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  for (let v=0; v<=100; v+=25) {
    const xx = gx - gw/2 + (v/100) * gw;
    ctx.beginPath();
    ctx.moveTo(xx, gy + gh/2);
    ctx.lineTo(xx, gy + gh/2 + 6);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(v, xx, gy + gh/2 + 18);
    ctx.textAlign = 'start';
  }
}

function drawGoalie(x, y, sh) {
  const now = performance.now();
  // 살짝 흔들기 (살아있음)
  const sway = Math.sin(now * 0.008) * 1.5;

  ctx.save();
  ctx.translate(x + sway, y);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // === 다리 패드 (큰 흰색 패드, 양쪽) ===
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 3.5;
  // 왼쪽 패드
  ctx.fillStyle = '#f5f5f5';
  roundRect(-32, 10, 22, 56, 8);
  ctx.fill();
  ctx.stroke();
  // 패드 가로 줄무늬
  ctx.strokeStyle = '#1e5fd4';
  ctx.lineWidth = 2.5;
  for (let i=0; i<3; i++) {
    ctx.beginPath();
    ctx.moveTo(-30, 20 + i*15);
    ctx.lineTo(-12, 20 + i*15);
    ctx.stroke();
  }
  // 오른쪽 패드
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 3.5;
  ctx.fillStyle = '#f5f5f5';
  roundRect(10, 10, 22, 56, 8);
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = '#1e5fd4';
  ctx.lineWidth = 2.5;
  for (let i=0; i<3; i++) {
    ctx.beginPath();
    ctx.moveTo(12, 20 + i*15);
    ctx.lineTo(30, 20 + i*15);
    ctx.stroke();
  }

  // === 몸통 (큰 푸른 유니폼 + 가슴 패드) ===
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 3.5;
  ctx.fillStyle = '#1e5fd4';
  // 가슴 패드 모양 (어깨 넓게)
  ctx.beginPath();
  ctx.moveTo(-38, -10);
  ctx.quadraticCurveTo(-42, 5, -38, 20);
  ctx.lineTo(38, 20);
  ctx.quadraticCurveTo(42, 5, 38, -10);
  ctx.quadraticCurveTo(0, -18, -38, -10);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 가슴 'W' 마크
  ctx.fillStyle = '#fff';
  ctx.font = '900 18px "Noto Sans KR", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('W', 0, 8);

  // === 어깨 패드 (둥근 양 어깨) ===
  ctx.fillStyle = '#1e5fd4';
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.arc(-36, -8, 14, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(36, -8, 14, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  // === 왼쪽 글러브 (캐쳐, 빨강) ===
  // 글러브 미스 시 다이빙
  let lGloveX = -52, lGloveY = -2;
  let rGloveX = 52, rGloveY = -2;
  if (sh && sh.animPhase === 'miss') {
    const t = Math.min(1, (performance.now() - sh.animStart) / 1500);
    if (sh.result.side === 'left') {
      lGloveX -= 25 * Math.sin(t * Math.PI);
      lGloveY -= 20 * Math.sin(t * Math.PI);
    } else {
      rGloveX += 25 * Math.sin(t * Math.PI);
      rGloveY -= 20 * Math.sin(t * Math.PI);
    }
  }
  ctx.fillStyle = '#cc1f3a';
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(lGloveX, lGloveY, 15, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  // 글러브 안쪽 (밝은 빨강)
  ctx.fillStyle = '#ff5577';
  ctx.beginPath();
  ctx.arc(lGloveX - 3, lGloveY - 3, 7, 0, Math.PI*2);
  ctx.fill();

  // === 오른쪽 블로커 (빨강 사각) ===
  ctx.fillStyle = '#cc1f3a';
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 3;
  roundRect(rGloveX - 12, rGloveY - 14, 24, 28, 5);
  ctx.fill();
  ctx.stroke();
  // 블로커 줄무늬
  ctx.strokeStyle = '#7a0f1f';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(rGloveX - 8, rGloveY - 8);
  ctx.lineTo(rGloveX + 8, rGloveY - 8);
  ctx.moveTo(rGloveX - 8, rGloveY);
  ctx.lineTo(rGloveX + 8, rGloveY);
  ctx.moveTo(rGloveX - 8, rGloveY + 8);
  ctx.lineTo(rGloveX + 8, rGloveY + 8);
  ctx.stroke();

  // === 골리 스틱 (블로커 아래로) ===
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(rGloveX, rGloveY + 14);
  ctx.lineTo(rGloveX + 28, rGloveY + 50);
  ctx.stroke();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(rGloveX, rGloveY + 14);
  ctx.lineTo(rGloveX + 28, rGloveY + 50);
  ctx.stroke();
  // 골리 스틱 블레이드 (넓은 패들)
  ctx.fillStyle = '#0a1228';
  ctx.beginPath();
  ctx.moveTo(rGloveX + 25, rGloveY + 44);
  ctx.lineTo(rGloveX + 38, rGloveY + 38);
  ctx.lineTo(rGloveX + 48, rGloveY + 60);
  ctx.lineTo(rGloveX + 35, rGloveY + 64);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(rGloveX + 27, rGloveY + 46);
  ctx.lineTo(rGloveX + 37, rGloveY + 40);
  ctx.lineTo(rGloveX + 46, rGloveY + 58);
  ctx.lineTo(rGloveX + 33, rGloveY + 62);
  ctx.closePath();
  ctx.fill();

  // === 골리 마스크 (헬멧) ===
  const maskY = -42;
  // 마스크 본체
  ctx.fillStyle = '#f5f5f5';
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.arc(0, maskY, 22, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  // 마스크 페인트 (파란색 디자인)
  ctx.fillStyle = '#1e5fd4';
  ctx.beginPath();
  ctx.arc(0, maskY - 5, 22, Math.PI * 1.1, Math.PI * 1.9);
  ctx.fill();
  // 페이스 케이지 그릴
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1.5;
  // 가로 바
  for (let i=0; i<4; i++) {
    ctx.beginPath();
    ctx.moveTo(-14, maskY - 4 + i*5);
    ctx.lineTo(14, maskY - 4 + i*5);
    ctx.stroke();
  }
  // 세로 바
  ctx.beginPath();
  ctx.moveTo(-5, maskY - 8);
  ctx.lineTo(-5, maskY + 14);
  ctx.moveTo(5, maskY - 8);
  ctx.lineTo(5, maskY + 14);
  ctx.stroke();

  // 눈 (집중)
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-6, maskY - 2, 2, 0, Math.PI*2);
  ctx.arc(6, maskY - 2, 2, 0, Math.PI*2);
  ctx.fill();
  // 입 (꽉 다문 입)
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-3, maskY + 8);
  ctx.lineTo(3, maskY + 8);
  ctx.stroke();

  // 마스크 상단 별 마크
  ctx.fillStyle = '#ffd700';
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  drawStarPath(0, maskY - 14, 5, 4, 2);
  ctx.fill();
  ctx.stroke();

  ctx.textAlign = 'start';
  ctx.restore();
}

// 별 path 헬퍼
function drawStarPath(cx, cy, points, outerR, innerR) {
  let rot = -Math.PI / 2;
  ctx.moveTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
  for (let i = 0; i < points; i++) {
    rot += Math.PI / points;
    ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
    rot += Math.PI / points;
    ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
  }
  ctx.closePath();
}

function drawGauge(value, locked=false) {
  const gx = W - 80;
  const gy = H * 0.5;
  const gw = 50;
  const gh = H * 0.55;

  // 배경
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(gx - gw/2, gy - gh/2, gw, gh);

  // 컬러 존
  const zones = [
    [0, 50, '#444'],
    [50, 80, '#cc9900'],
    [80, 95, '#cc5500'],
    [95, 100, performance.now() % 200 < 100 ? '#ff0000' : '#aa0000'],
  ];
  for (const [from, to, col] of zones) {
    ctx.fillStyle = col;
    const y1 = gy + gh/2 - (from/100) * gh;
    const y2 = gy + gh/2 - (to/100) * gh;
    ctx.fillRect(gx - gw/2, y2, gw, y1 - y2);
  }

  // === 잔상 효과 (locked 아닐 때만) ===
  if (!locked) {
    // 잔상 위치 계산: 최근 5개 위치를 sin 곡선으로 시뮬레이션
    const sh = STATE.shoot;
    const now = performance.now();
    for (let i = 1; i <= 6; i++) {
      const trailT = i * 25; // 25ms씩 과거
      // 과거 위치 추정 (현재 dir 기준 역산)
      const speed = (sh.value > CFG.SHOOT_JACKPOT_ZONE) ? CFG.SHOOT_JACKPOT_MULT : 1;
      const baseSpeed = 100 / (CFG.SHOOT_PERIOD_MS / 2 / 1000);
      const deltaV = baseSpeed * speed * (trailT/1000) * sh.dir;
      let trailV = sh.value - deltaV;
      // 0~100 바운스 처리
      if (trailV < 0) trailV = -trailV;
      if (trailV > 100) trailV = 200 - trailV;
      trailV = Math.max(0, Math.min(100, trailV));

      const alpha = (1 - i/7) * 0.4;
      const trailY = gy + gh/2 - (trailV/100) * gh;
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(gx, trailY, 6 + (1 - i/7) * 4, 0, Math.PI*2);
      ctx.fill();
    }

    // 양옆 스피드 라인 (왕복 강조)
    const speedPulse = (Math.sin(now * 0.025) + 1) / 2;
    ctx.strokeStyle = `rgba(255, 220, 50, ${0.4 + speedPulse * 0.5})`;
    ctx.lineWidth = 2;
    for (let j = 0; j < 3; j++) {
      const yPos = gy - gh/2 + (j * gh / 3) + (now * 0.5 % (gh/3));
      ctx.beginPath();
      ctx.moveTo(gx + gw/2 + 5, yPos);
      ctx.lineTo(gx + gw/2 + 12, yPos);
      ctx.moveTo(gx - gw/2 - 12, yPos);
      ctx.lineTo(gx - gw/2 - 5, yPos);
      ctx.stroke();
    }
  }

  // 외곽선
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeRect(gx - gw/2, gy - gh/2, gw, gh);

  // 현재 화살표 (메인)
  const arrowY = gy + gh/2 - (value/100) * gh;
  // 화살표 글로우
  if (!locked) {
    ctx.save();
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#ffff00';
    ctx.beginPath();
    ctx.moveTo(gx - gw/2 - 5, arrowY);
    ctx.lineTo(gx - gw/2 - 28, arrowY - 14);
    ctx.lineTo(gx - gw/2 - 28, arrowY + 14);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  } else {
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(gx - gw/2 - 5, arrowY);
    ctx.lineTo(gx - gw/2 - 28, arrowY - 14);
    ctx.lineTo(gx - gw/2 - 28, arrowY + 14);
    ctx.closePath();
    ctx.fill();
  }

  // 숫자 표시 (큼직하게)
  ctx.fillStyle = locked ? '#ffd700' : '#fff';
  ctx.font = 'bold 42px sans-serif';
  ctx.textAlign = 'center';
  // 숫자 글로우
  if (!locked) {
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 20;
  }
  ctx.fillText(Math.round(value), gx, gy + gh/2 + 52);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'start';

  // 눈금
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  for (let v=0; v<=100; v+=25) {
    const yy = gy + gh/2 - (v/100) * gh;
    ctx.beginPath();
    ctx.moveTo(gx + gw/2, yy);
    ctx.lineTo(gx + gw/2 + 8, yy);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(v, gx + gw/2 + 10, yy + 5);
  }

  // 게이지 위 "고고고!" 표시 (locked 아닐 때 깜빡임)
  if (!locked) {
    const blink = Math.sin(performance.now() * 0.015) > 0;
    if (blink) {
      ctx.fillStyle = '#ff3355';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('NOW!', gx, gy - gh/2 - 12);
      ctx.textAlign = 'start';
    }
  }
}

// ============================================================
// 종료 및 결과
// ============================================================
function endGame() {
  STATE.phase = 'result';
  document.getElementById('shooting-ui').classList.remove('active');
  document.getElementById('hud').style.display = 'none';
  document.getElementById('result-screen').classList.remove('hidden');

  // 점수 표시
  const scoreEl = document.getElementById('result-score');
  scoreEl.textContent = STATE.score;
  if (STATE.score < 0) scoreEl.classList.add('negative');
  else scoreEl.classList.remove('negative');

  // 점수 카운트업
  let cur = 0;
  const target = STATE.score;
  const startVal = 0;
  const duration = 1500;
  const tStart = performance.now();
  function tick() {
    const t = Math.min(1, (performance.now() - tStart) / duration);
    cur = Math.round(startVal + (target - startVal) * t);
    scoreEl.textContent = cur;
    if (t < 1) requestAnimationFrame(tick);
  }
  tick();

  // 분해 점수
  const trainingScore = STATE.stats.coneNormal * CFG.SCORE_CONE +
                        STATE.stats.coneCombo * CFG.SCORE_CONE_COMBO +
                        STATE.stats.bossNormal * CFG.SCORE_BOSS +
                        STATE.stats.bossCombo * CFG.SCORE_BOSS_COMBO +
                        STATE.stats.energy * CFG.SCORE_ENERGY +
                        STATE.stats.hits * CFG.PENALTY_HIT;
  const dribbleScore = STATE.stats.normalTaps * CFG.SCORE_TAP_NORMAL;
  const feverScore = STATE.stats.feverTaps * CFG.SCORE_TAP_FEVER;
  const shootScore = STATE.stats.shootScore;

  document.getElementById('result-breakdown').innerHTML = `
    <div class="result-row"><span class="label">TRAINING · Pattern ${STATE.patternKey}</span><span class="value">${trainingScore}</span></div>
    <div class="result-row"><span class="label">DRIBBLE · ${STATE.stats.normalTaps} taps</span><span class="value">${dribbleScore}</span></div>
    <div class="result-row"><span class="label">FEVER · ${STATE.stats.feverTaps} taps</span><span class="value">${feverScore}</span></div>
    <div class="result-row"><span class="label">SHOOTING</span><span class="value">${shootScore}</span></div>
    <div class="result-row" style="border-top:1px solid rgba(255,255,255,0.12); margin-top:8px; padding-top:12px;"><span class="label">HITS · ${STATE.stats.hits}</span><span class="value" style="color:#ff8888">${STATE.stats.hits * CFG.PENALTY_HIT}</span></div>
  `;

  document.getElementById('name-input').value = '';
}

// ============================================================
// 순위표
// ============================================================
const RANK_KEY = 'westHockeyRanking';

function loadRanking() {
  try {
    return JSON.parse(localStorage.getItem(RANK_KEY) || '[]');
  } catch(e) { return []; }
}

function saveRanking(name, score) {
  const list = loadRanking();
  list.push({ name, score, date: new Date().toISOString().slice(0,10) });
  list.sort((a,b) => b.score - a.score);
  localStorage.setItem(RANK_KEY, JSON.stringify(list.slice(0, 20)));
}

function renderRanking() {
  const list = loadRanking().slice(0, 5);
  const el = document.getElementById('ranking-list');
  if (list.length === 0) {
    el.innerHTML = '<div class="ranking-empty">BE THE FIRST CHALLENGER</div>';
    return;
  }
  el.innerHTML = list.map((r, i) => `
    <div class="ranking-row">
      <span class="rank">#${i+1}</span>
      <span class="name">${escapeHtml(r.name)}</span>
      <span class="score">${r.score}</span>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// 이벤트 바인딩
// ============================================================
document.getElementById('start-btn').addEventListener('click', (e) => {
  e.preventDefault();
  initAudio();
  startGame();
});
document.getElementById('start-btn').addEventListener('touchend', (e) => {
  e.preventDefault();
  initAudio();
  startGame();
});

document.getElementById('save-btn').addEventListener('click', (e) => {
  e.preventDefault();
  const name = document.getElementById('name-input').value.trim().slice(0, 5) || 'ANON';
  saveRanking(name, STATE.score);
  renderRanking();
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('start-screen').classList.remove('hidden');
  STATE.phase = 'menu';
});

document.getElementById('retry-btn').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('result-screen').classList.add('hidden');
  startGame();
});

// 페이지 로드 시
renderRanking();
