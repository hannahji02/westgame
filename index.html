<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WEST HOCKEY MT 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0f1c;
    font-family: 'Trebuchet MS', 'Helvetica Neue', sans-serif;
    touch-action: none;
  }
  #app {
    position: relative;
    width: 100vw; height: 100vh;
    max-width: 100vw; max-height: 100vh;
    overflow: hidden;
    background: linear-gradient(180deg, #0a0f1c 0%, #1a2540 100%);
  }
  #game-canvas {
    display: block;
    width: 100%; height: 100%;
    background: transparent;
  }

  /* === 상단 HUD === */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px;
    z-index: 10;
    pointer-events: none;
    font-weight: 900;
    letter-spacing: 1px;
  }
  #score-display {
    color: #fff;
    font-size: 32px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 20px rgba(64,160,255,0.6);
    transition: color 0.2s;
  }
  #score-display.negative { color: #ff3355; text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 20px rgba(255,50,80,0.8); }
  #timer-display {
    color: #ffcc00;
    font-size: 28px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 16px rgba(255,200,0,0.5);
  }
  #combo-display {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    font-size: 48px; font-weight: 900;
    color: #ffd700;
    text-shadow: 0 4px 12px rgba(0,0,0,0.9), 0 0 24px rgba(255,215,0,0.8);
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    letter-spacing: 3px;
  }
  #combo-display.show { animation: comboFlash 1s ease-out; }
  @keyframes comboFlash {
    0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
    30% { opacity: 1; transform: translateX(-50%) scale(1.2); }
    100% { opacity: 0; transform: translateX(-50%) scale(1); }
  }

  /* === 화면 흔들기 === */
  #app.shake { animation: shake 0.2s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-12px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(6px); }
  }

  /* === 피버 오버레이 === */
  #fever-overlay {
    position: absolute; inset: 0;
    background: radial-gradient(circle, transparent 30%, rgba(255,30,60,0.4) 100%);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  #fever-overlay.active { animation: feverStrobe 0.3s infinite alternate; }
  @keyframes feverStrobe {
    0% { opacity: 0.2; }
    100% { opacity: 0.8; }
  }

  /* === 시작/결과 화면 === */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    background: linear-gradient(180deg, #0a0f1c 0%, #1a2540 50%, #0a0f1c 100%);
    padding: 40px;
  }
  .screen.hidden { display: none; }

  .title {
    font-size: 56px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 4px;
    text-shadow: 0 0 30px rgba(64,160,255,0.8), 0 0 60px rgba(64,160,255,0.4);
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    font-size: 22px;
    color: #88a8ff;
    letter-spacing: 6px;
    margin-bottom: 40px;
    font-weight: 700;
  }

  .ranking-box {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(64,160,255,0.4);
    border-radius: 16px;
    padding: 24px 32px;
    min-width: 360px;
    margin-bottom: 40px;
    backdrop-filter: blur(10px);
  }
  .ranking-title {
    color: #ffd700;
    font-size: 20px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 16px;
    letter-spacing: 3px;
  }
  .ranking-row {
    display: flex; justify-content: space-between;
    color: #fff; font-size: 18px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-weight: 700;
  }
  .ranking-row:last-child { border-bottom: none; }
  .ranking-row .rank { color: #ffcc00; width: 40px; }
  .ranking-row .name { flex: 1; text-align: left; padding-left: 12px; }
  .ranking-row .score { color: #64d8ff; }
  .ranking-empty { color: rgba(255,255,255,0.5); text-align: center; font-size: 16px; padding: 16px 0; }

  .btn-primary {
    background: linear-gradient(135deg, #ff3355 0%, #ff8833 100%);
    color: #fff;
    border: none;
    padding: 20px 60px;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 4px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,50,80,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    transition: transform 0.1s;
    font-family: inherit;
  }
  .btn-primary:active { transform: scale(0.96); }

  .guide-text {
    margin-top: 32px;
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    line-height: 1.8;
    text-align: center;
    letter-spacing: 1px;
  }

  /* === 결과 화면 === */
  .result-score {
    font-size: 80px;
    font-weight: 900;
    color: #ffd700;
    text-shadow: 0 0 40px rgba(255,215,0,0.8);
    margin: 20px 0;

  }
  .result-score.negative { color: #ff3355; text-shadow: 0 0 40px rgba(255,50,80,0.8); }
  .result-breakdown {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 20px 32px;
    margin-bottom: 24px;
    min-width: 320px;
  }
  .result-row {
    display: flex; justify-content: space-between;
    color: #fff; font-size: 16px;
    padding: 6px 0;
    font-weight: 700;
  }
  .result-row .label { color: #88a8ff; }

  .name-input {
    margin-bottom: 20px;
    text-align: center;
  }
  .name-input input {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(64,160,255,0.6);
    color: #fff;
    padding: 14px 20px;
    font-size: 22px;
    font-weight: 900;
    text-align: center;
    border-radius: 12px;
    width: 200px;
    letter-spacing: 4px;
    font-family: inherit;
    outline: none;
  }
  .name-input input::placeholder { color: rgba(255,255,255,0.4); letter-spacing: 2px; }

  .result-buttons {
    display: flex; gap: 16px;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.4);
    color: #fff;
    padding: 14px 32px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-secondary:active { transform: scale(0.96); }

  /* === 카운트다운 === */
  #countdown {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
    pointer-events: none;
  }
  #countdown-num {
    font-size: 200px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 40px rgba(64,160,255,0.8);
    opacity: 0;
    pointer-events: none;
  }
  #countdown-num.show { animation: countdownPulse 1s ease-out; }
  @keyframes countdownPulse {
    0% { opacity: 0; transform: scale(2); }
    30% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.8); }
  }

  /* === 슈팅 미션 UI === */
  #shooting-ui {
    position: absolute; inset: 0;
    z-index: 30;
    pointer-events: none;
    display: none;
  }
  #shooting-ui.active { display: block; pointer-events: none; }
  #shooting-hint {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff; font-size: 32px; font-weight: 900;
    text-shadow: 0 0 20px rgba(0,0,0,0.9);
    letter-spacing: 4px;
    text-align: center;
    pointer-events: none;
  }

  #toast {
    position: absolute; top: 30%; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 40px; font-weight: 900;
    text-shadow: 0 4px 16px rgba(0,0,0,0.9);
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    letter-spacing: 3px;
  }
  #toast.show { animation: toastPop 1.2s ease-out; }
  @keyframes toastPop {
    0% { opacity: 0; transform: translate(-50%, 20px); }
    20% { opacity: 1; transform: translate(-50%, 0); }
    80% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -20px); }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game-canvas"></canvas>

  <!-- 상단 HUD -->
  <div id="hud" style="display:none;">
    <div id="score-display">0</div>

  </div>

    <div id="countdown-num"></div>

  <!-- 슈팅 UI -->

    <div id="shooting-hint">골리를 속여라!<br>좌/우 영역을 골라<br>꾹 누르고 떼세요</div>

      <div class="ranking-title">🏆 TOP 5 🏆</div>

    <button class="btn-primary" id="start-btn">게임 시작</button>

      😡 감독 → 위 스와이프로 점프 통과<br>

      <button class="btn-secondary" id="save-btn">기록 저장</button>
      <button class="btn-secondary" id="retry-btn">다시 도전</button>

</div>

<script>

// ============================================================

  // 골리 움직임
  GOALIE_PERIOD_MS: 1500, // 1왕복
  GOALIE_RANGE_RATIO: 0.7, // 골대 폭의 70% 안에서 왕복
  GOALIE_CENTER_TOLERANCE: 0.2, // 중앙 ±20%는 50% 확률

  // 색상
  COL_BG_ICE: '#e8f0ff',
  COL_BG_ICE_LINE: '#b8d0f0',
  COL_PLAYER: '#1e5fd4',
  COL_PLAYER_STICK: '#8B4513',
  COL_CONE: '#ff7a1f',
  COL_BOSS: '#d4a574',
  COL_BOSS_AVOIDED: '#888',
  COL_ENERGY: '#00d058',
};

// ============================================================
// 4종 패턴 데이터 (시간:구간:오브젝트)
// ============================================================
const PATTERNS = {
  A: [ // 좌익 폭격
    [0.00,1,'cone'],[0.55,2,'cone'],[1.10,1,'cone'],[1.65,1,'boss'],[2.30,2,'cone'],
    [2.85,3,'cone'],[2.85,1,'cone'],[3.40,1,'cone'],[3.95,1,'energy'],[4.20,1,'cone'],
    [4.75,2,'boss'],[5.40,3,'cone'],[5.95,1,'boss'],[6.60,2,'cone'],[6.60,3,'cone'],
    [7.15,1,'cone'],[7.70,2,'boss'],[8.35,1,'cone'],[8.90,3,'boss'],[9.55,1,'cone'],
    [10.20,2,'cone'],[10.75,3,'cone'],[11.30,1,'cone'],[11.85,2,'energy'],[12.10,2,'cone'],
    [12.65,1,'boss'],[13.30,2,'boss'],[13.95,3,'boss']
  ],
  B: [ // 지그재그 댄스
    [0.00,1,'cone'],[0.55,3,'cone'],[1.10,1,'cone'],[1.65,3,'boss'],[2.30,1,'cone'],
    [2.85,3,'cone'],[3.40,2,'cone'],[3.95,2,'energy'],[4.20,2,'cone'],[4.75,1,'boss'],
    [5.40,3,'cone'],[5.95,1,'cone'],[5.95,3,'cone'],[6.60,2,'boss'],[7.15,1,'cone'],
    [7.70,3,'cone'],[8.35,2,'cone'],[8.90,1,'boss'],[9.55,3,'cone'],[10.20,2,'energy'],
    [10.45,2,'cone'],[11.00,1,'cone'],[11.00,3,'cone'],[11.55,2,'boss'],[12.20,1,'boss'],
    [12.75,3,'boss'],[13.30,2,'cone'],[13.85,1,'boss']
  ],
  C: [ // 감독 러시
    [0.00,2,'cone'],[0.55,1,'boss'],[1.20,3,'cone'],[1.75,2,'cone'],[2.30,3,'boss'],
    [2.95,2,'cone'],[2.95,1,'cone'],[3.50,3,'cone'],[4.05,2,'energy'],[4.30,2,'cone'],
    [4.85,1,'boss'],[5.50,2,'cone'],[6.05,3,'cone'],[6.05,1,'cone'],[6.60,2,'boss'],
    [7.25,3,'cone'],[7.80,1,'cone'],[8.35,3,'boss'],[9.00,2,'cone'],[9.55,1,'cone'],
    [10.10,3,'cone'],[10.65,2,'energy'],[10.90,2,'cone'],[11.45,1,'boss'],[12.10,3,'boss'],
    [12.75,2,'cone'],[13.30,1,'cone'],[13.85,2,'boss']
  ],
  D: [ // 센터 폭주
    [0.00,2,'cone'],[0.55,2,'cone'],[1.10,1,'cone'],[1.65,2,'boss'],[2.30,3,'cone'],
    [2.85,2,'cone'],[2.85,3,'cone'],[3.40,1,'boss'],[4.05,2,'cone'],[4.60,3,'energy'],
    [4.85,3,'cone'],[5.40,2,'boss'],[6.05,1,'cone'],[6.05,3,'cone'],[6.60,2,'cone'],

    [12.75,1,'cone'],[13.30,3,'cone'],[13.85,2,'boss']
  ]

// ============================================================
// 사운드 시스템 (WebAudio API 합성)
// ============================================================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { console.warn('Audio not supported'); }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, duration, type='sine', vol=0.3) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration);
}
function playNoise(duration, vol=0.2) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0; i<bufferSize; i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  src.connect(gain).connect(audioCtx.destination);
  src.start(t);
}
const SFX = {
  tap: () => playTone(600, 0.05, 'square', 0.15),
  drag: () => playNoise(0.2, 0.15),
  hit: () => { playTone(100, 0.3, 'sawtooth', 0.4); playNoise(0.3, 0.3); },
  energy: () => { playTone(800, 0.1, 'sine', 0.3); setTimeout(()=>playTone(1200, 0.15, 'sine', 0.25), 50); },
  goal: () => {
    [440, 554, 659, 880].forEach((f, i) => setTimeout(()=>playTone(f, 0.3, 'sine', 0.3), i*100));
  },
  miss: () => playTone(150, 0.2, 'triangle', 0.4),
  combo: () => { playTone(880, 0.1, 'sine', 0.3); setTimeout(()=>playTone(1320, 0.15, 'sine', 0.3), 80); },
  countdown: () => playTone(440, 0.1, 'sine', 0.3),
  go: () => { playTone(880, 0.2, 'sine', 0.4); setTimeout(()=>playTone(1320, 0.3, 'sine', 0.4), 150); },
};

// ============================================================
// Canvas 및 상태
// ============================================================
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let laneWidth = 0;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  laneWidth = W / 3;
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// 게임 상태
// ============================================================
const STATE = {
  phase: 'menu', // menu, training, dribble, fever, shooting, result
  startTime: 0,
  elapsed: 0,

  player: { lane: 2, x: 0, y: 0, alpha: 1, invincibleUntil: 0, jumpUntil: 0 },

  obstacles: [], // {type, lane, y, spawnTime, avoided, id}
  particles: [],

  bgScrollY: 0,

  score: 0,
  combo: 0,
  stats: { coneNormal:0, coneCombo:0, bossNormal:0, bossCombo:0, energy:0, hits:0, normalTaps:0, feverTaps:0, shootScore:0 },

  patternKey: 'A',
  patternQueue: [], // 남은 스폰

  // 슈팅 미션
  shoot: { active:false, value:0, dir:1, startTime:0, holdStart:0, locked:false, result:null, ready:false, animStart:0, side:'left', goalieT:0 },

  // 드리블 애니메이션
  dribble: { dir: 1, hitTime: 0, puckX: 0 },

  obstacleIdCounter: 0,
};

// ============================================================
// 입력 처리
// ============================================================
const TOUCH = { active:false, startX:0, startY:0, startTime:0, id:null };

function onTouchStart(e) {
  e.preventDefault();
  initAudio();
  if (TOUCH.active) return;
  const t = e.changedTouches ? e.changedTouches[0] : e;
  TOUCH.active = true;
  TOUCH.id = e.changedTouches ? t.identifier : 'mouse';
  TOUCH.startX = t.clientX;
  TOUCH.startY = t.clientY;
  TOUCH.startTime = performance.now();

  // 슈팅 미션 홀드 시작
  if (STATE.phase === 'shooting' && STATE.shoot.ready && !STATE.shoot.locked) {
    STATE.shoot.holdStart = performance.now();
    STATE.shoot.side = t.clientX < W/2 ? 'left' : 'right';
  }
}

function onTouchMove(e) {
  if (!TOUCH.active) return;
  // 슈팅 중 좌/우 영역 토글
  if (STATE.phase === 'shooting' && STATE.shoot.ready && !STATE.shoot.locked && STATE.shoot.holdStart > 0) {
    const t = e.changedTouches ? e.changedTouches[0] : e;
    if (e.changedTouches) {
      let found = false;
      for (let i=0; i<e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === TOUCH.id) { found = true; break; }
      }
      if (!found) return;
    }
    const newSide = t.clientX < W/2 ? 'left' : 'right';
    if (STATE.shoot.side !== newSide) {
      STATE.shoot.side = newSide;
      SFX.tap();
    }
  }
}

function onTouchEnd(e) {
  e.preventDefault();
  if (!TOUCH.active) return;
  const t = e.changedTouches ? e.changedTouches[0] : e;
  if (e.changedTouches) {
    let found = false;
    for (let i=0; i<e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === TOUCH.id) { found = true; break; }
    }
    if (!found) return;
  }
  const endX = t.clientX, endY = t.clientY;
  const dx = endX - TOUCH.startX, dy = endY - TOUCH.startY;
  const dist = Math.hypot(dx, dy);
  const dt = performance.now() - TOUCH.startTime;

  TOUCH.active = false;

  // 슈팅 미션 릴리즈
  if (STATE.phase === 'shooting' && STATE.shoot.ready && !STATE.shoot.locked) {
    if (performance.now() - STATE.shoot.holdStart > 50) {
      executeShoot();
      return;
    }
  }

  // 드리블/피버 - 탭만 받음
  if (STATE.phase === 'dribble' || STATE.phase === 'fever') {
    if (dist < CFG.DRAG_MIN_DIST) {
      handleTapDribble();
    }
    return;
  }

  // 훈련 단계 - 스와이프 4방향 판정
  if (STATE.phase === 'training') {
    if (dist >= CFG.DRAG_MIN_DIST && dt <= CFG.DRAG_MAX_TIME) {
      if (Math.abs(dx) > Math.abs(dy)) {
        // 수평 스와이프 → 좌/우 한 칸 이동
        if (dx > 0) handleSwipeRight();
        else handleSwipeLeft();
      } else {
        // 수직 스와이프 → 위 = 점프 (아래는 무시)
        if (dy < 0) handleJump();
      }
    }
    // 거리/시간 미달 시 무시
  }
}

function handleSwipeLeft() {
  if (STATE.player.lane > 1) {
    STATE.player.lane--;
    SFX.tap();
  }
}

function handleSwipeRight() {
  if (STATE.player.lane < 3) {
    STATE.player.lane++;
    SFX.tap();
  }
}

function handleJump() {
  const now = performance.now();
  if (now < STATE.player.jumpUntil) return; // 점프 중 중복 무시
  STATE.player.jumpUntil = now + CFG.JUMP_DURATION;
  SFX.drag();
}

function handleTapDribble() {
  if (STATE.phase === 'dribble') {
    STATE.score += CFG.SCORE_TAP_NORMAL;
    STATE.stats.normalTaps++;
  } else if (STATE.phase === 'fever') {
    STATE.score += CFG.SCORE_TAP_FEVER;
    STATE.stats.feverTaps++;
  }
  SFX.tap();
  updateScoreDisplay();
  // 드리블 애니메이션 트리거
  STATE.puckShake = 12;
  STATE.dribble.dir *= -1; // 방향 토글
  STATE.dribble.hitTime = performance.now();
  // 파티클 (얼음 가루)
  const puckCx = W/2 + STATE.dribble.puckX;
  const puckCy = H/2;
  for (let i=0; i<5; i++) {
    STATE.particles.push({
      x: puckCx, y: puckCy,
      vx: (Math.random()-0.5)*100, vy: (Math.random()-0.5)*100 - 30,
      life: 0.3, maxLife: 0.3,
      color: '#ffffff', size: 2 + Math.random()*2,
    });
  }
}

canvas.addEventListener('touchstart', onTouchStart, {passive:false});
canvas.addEventListener('touchmove', onTouchMove, {passive:false});
canvas.addEventListener('touchend', onTouchEnd, {passive:false});
canvas.addEventListener('mousedown', onTouchStart);
canvas.addEventListener('mousemove', onTouchMove);
canvas.addEventListener('mouseup', onTouchEnd);

// ============================================================
// 게임 시작
// ============================================================
function startGame() {
  STATE.phase = 'training';
  STATE.startTime = performance.now();
  STATE.elapsed = 0;
  STATE.player = { lane: 2, x:0, y:0, alpha:1, invincibleUntil:0, jumpUntil:0 };
  STATE.obstacles = [];
  STATE.particles = [];
  STATE.bgScrollY = 0;
  STATE.score = 0;
  STATE.combo = 0;
  STATE.stats = { coneNormal:0, coneCombo:0, bossNormal:0, bossCombo:0, energy:0, hits:0, normalTaps:0, feverTaps:0, shootScore:0 };

  // 패턴 추첨
  const keys = ['A', 'B', 'C', 'D'];
  STATE.patternKey = keys[Math.floor(Math.random() * keys.length)];
  STATE.patternQueue = PATTERNS[STATE.patternKey].slice();

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('fever-overlay').classList.remove('active');
  document.getElementById('shooting-ui').classList.remove('active');

  updateScoreDisplay();
  SFX.go();
}

// ============================================================
// 메인 루프
// ============================================================
let lastTime = 0;
function loop(now) {
  const dt = Math.min(50, now - lastTime) / 1000; // 초 단위, 최대 50ms cap
  lastTime = now;

  if (STATE.phase !== 'menu' && STATE.phase !== 'result') {
    update(dt, now);
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame((t) => { lastTime = t; loop(t); });

function update(dt, now) {
  if (STATE.phase === 'shooting') {
    updateShooting(dt, now);
    return;
  }

  STATE.elapsed = now - STATE.startTime;

  // 단계 전환
  if (STATE.phase === 'training' && STATE.elapsed >= CFG.TRAINING_END) {
    enterDribble();
  } else if (STATE.phase === 'dribble' && STATE.elapsed >= CFG.DRIBBLE_END) {
    enterFever();
  } else if (STATE.phase === 'fever' && STATE.elapsed >= CFG.FEVER_END) {
    enterShooting();
    return;
  }

  // 타이머 표시
  const remainingMs = Math.max(0, CFG.TOTAL_TIME - STATE.elapsed);
  document.getElementById('timer-display').textContent = (remainingMs / 1000).toFixed(1);

  // 플레이어 위치 보간
  const targetX = (STATE.player.lane - 0.5) * laneWidth;
  STATE.player.x += (targetX - STATE.player.x) * Math.min(1, dt * 18);
  STATE.player.y = H * CFG.PLAYER_Y_RATIO;

  // 배경 스크롤 (훈련 중에만)
  if (STATE.phase === 'training') {
    const t = STATE.elapsed / CFG.TRAINING_END;
    const bgSpeed = CFG.BG_SCROLL_START + (CFG.BG_SCROLL_END - CFG.BG_SCROLL_START) * t;
    STATE.bgScrollY = (STATE.bgScrollY + bgSpeed * dt) % 80;
  }

  // 오브젝트 스폰
  if (STATE.phase === 'training') {
    while (STATE.patternQueue.length > 0 && STATE.patternQueue[0][0] * 1000 <= STATE.elapsed) {
      const [t, lane, type] = STATE.patternQueue.shift();
      spawnObstacle(lane, type);
    }
  }

  // 오브젝트 업데이트
  const tProgress = Math.min(1, STATE.elapsed / CFG.TRAINING_END);
  const fallSpeed = CFG.FALL_SPEED_START + (CFG.FALL_SPEED_END - CFG.FALL_SPEED_START) * tProgress;

  for (let i = STATE.obstacles.length - 1; i >= 0; i--) {
    const obs = STATE.obstacles[i];
    const prevY = obs.y;
    obs.y += fallSpeed * dt;

    // === 콘 회피 카운트: 플레이어 라인 통과 시점 ===
    if (obs.type === 'cone' && !obs.passed && !obs.collided) {
      // 플레이어 Y를 막 통과한 프레임
      if (prevY <= STATE.player.y && obs.y > STATE.player.y) {
        obs.passed = true;
        // 다른 라인이었으면 회피 성공
        if (obs.lane !== STATE.player.lane) {
          STATE.combo++;
          if (STATE.combo >= CFG.COMBO_THRESHOLD) {
            STATE.score += CFG.SCORE_CONE_COMBO;
            STATE.stats.coneCombo++;
            if (STATE.combo === CFG.COMBO_THRESHOLD) showCombo();
          } else {
            STATE.score += CFG.SCORE_CONE;
            STATE.stats.coneNormal++;
          }
        }
      }
    }

    // === 감독 회피 카운트: Y축 통과 시점 (점프 안한 경우는 충돌 처리됨) ===
    if (obs.type === 'boss' && !obs.passed && obs.avoided) {
      if (prevY <= STATE.player.y && obs.y > STATE.player.y) {
        obs.passed = true; // 이미 avoided 시점에 점수 가산됨, 중복 방지용 마킹만
      }
    }

    // 화면 밖
    if (obs.y > H + 50) {
      STATE.obstacles.splice(i, 1);
      continue;
    }

    // 충돌 판정
    if (now > STATE.player.invincibleUntil && !obs.collided) {
      // 이미 통과(passed) 또는 회피(avoided)된 오브젝트는 충돌 면제
      if (obs.passed || obs.avoided) continue;
      // 감독은 lane 무시 (가로 장벽), 콘/캔은 같은 lane만 체크
      const laneMatch = (obs.type === 'boss') || (obs.lane === STATE.player.lane);
      if (laneMatch) {
        const dist = Math.abs(obs.y - STATE.player.y);
        if (dist < CFG.COLLISION_DIST) {
          const isJumping = now < STATE.player.jumpUntil;
          // 점프 중 감독: 자동 회피 + 콤보/점수
          if (isJumping && obs.type === 'boss' && !obs.avoided) {
            obs.avoided = true;
            STATE.combo++;
            if (STATE.combo >= CFG.COMBO_THRESHOLD) {
              STATE.score += CFG.SCORE_BOSS_COMBO;
              STATE.stats.bossCombo++;
              if (STATE.combo === CFG.COMBO_THRESHOLD) showCombo();
            } else {
              STATE.score += CFG.SCORE_BOSS;
              STATE.stats.bossNormal++;
            }
            SFX.drag();
            updateScoreDisplay();
            continue;
          }
          // 점프 중 캔: 미습득 (지면 한정)
          if (isJumping && obs.type === 'energy') {
            continue;
          }
          handleCollision(obs);
        }
      }
    }
  }

  // 점수 표시
  updateScoreDisplay();

  // 파티클 업데이트
  for (let i = STATE.particles.length - 1; i >= 0; i--) {
    const p = STATE.particles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 200 * dt;
    if (p.life <= 0) STATE.particles.splice(i, 1);
  }

  // 무적 알파 깜빡임
  if (now < STATE.player.invincibleUntil) {
    STATE.player.alpha = 0.4 + 0.5 * Math.sin(now * 0.04);
  } else {
    STATE.player.alpha = 1;
  }
}

function spawnObstacle(lane, type) {
  STATE.obstacles.push({
    id: STATE.obstacleIdCounter++,
    type, lane,
    y: -50,
    avoided: false,
    collided: false,
    passed: false,
  });
}

function handleCollision(obs) {
  if (obs.type === 'energy') {
    // 음료캔 - 같은 라인 통과 = 습득
    STATE.score += CFG.SCORE_ENERGY;
    STATE.stats.energy++;
    obs.collided = true;
    obs.y = H + 100; // 즉시 제거
    SFX.energy();
    spawnParticles(STATE.player.x, STATE.player.y, '#00ff88', 12);
    updateScoreDisplay();
    return;
  }

  if (obs.type === 'boss' && obs.avoided) return; // 회피 완료된 감독 통과

  // 충돌!
  obs.collided = true;
  STATE.score += CFG.PENALTY_HIT;
  STATE.combo = 0;
  STATE.stats.hits++;
  STATE.player.invincibleUntil = performance.now() + CFG.INVINCIBLE_MS;
  obs.y = H + 100; // 제거
  SFX.hit();
  shakeScreen();
  spawnParticles(STATE.player.x, STATE.player.y, '#ff3355', 16);
  updateScoreDisplay();
}

function spawnParticles(x, y, color, count) {
  for (let i=0; i<count; i++) {
    const angle = (Math.PI * 2 * i / count) + Math.random() * 0.5;
    const speed = 100 + Math.random() * 150;
    STATE.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 50,
      life: 0.5 + Math.random() * 0.3,
      maxLife: 0.8,
      color,
      size: 3 + Math.random() * 4,
    });
  }
}

function shakeScreen() {
  const app = document.getElementById('app');
  app.classList.remove('shake');
  void app.offsetWidth;
  app.classList.add('shake');
}

function showCombo() {
  const el = document.getElementById('combo-display');
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  SFX.combo();
}

function showToast(text, color) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.style.color = color || '#fff';
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function updateScoreDisplay() {
  const el = document.getElementById('score-display');
  el.textContent = STATE.score;
  if (STATE.score < 0) el.classList.add('negative');
  else el.classList.remove('negative');
}

// ============================================================
// 단계 전환
// ============================================================
function enterDribble() {
  STATE.phase = 'dribble';
  STATE.obstacles = []; // 잔여 장애물 청소
  showToast('GO! GO! 광속 탭!', '#ffd700');
  SFX.go();
}

function enterFever() {
  STATE.phase = 'fever';
  document.getElementById('fever-overlay').classList.add('active');
  showToast('🔥 FEVER TIME 🔥', '#ff3355');
  SFX.go();
}

function enterShooting() {
  STATE.phase = 'shooting';
  STATE.elapsed = CFG.FEVER_END;
  document.getElementById('fever-overlay').classList.remove('active');
  document.getElementById('hud').style.display = 'none';
  document.getElementById('shooting-ui').classList.add('active');

  STATE.shoot = {
    active: true,
    value: 0,
    dir: 1,
    startTime: performance.now(),
    holdStart: 0,
    locked: false,
    result: null,
    ready: false,
    countdown: 3,
    countdownStart: performance.now(),
    animStart: 0,
    animPhase: null,
    side: 'left', // 초기 영역
    goalieT: 0, // 골리 위치 정규화 시간 (0~1)
  };

  // 카운트다운 시작
  showCountdown(3);
}

function showCountdown(n) {
  const el = document.getElementById('countdown');
  const num = document.getElementById('countdown-num');
  el.style.display = 'flex';
  num.textContent = n;
  num.classList.remove('show');
  void num.offsetWidth;
  num.classList.add('show');
  SFX.countdown();
}

function updateShooting(dt, now) {
  const sh = STATE.shoot;
  if (sh.animPhase === 'done') return;

  // 골리 위치 업데이트 (locked 전까지 항상 진행, 락 후엔 정지)
  if (!sh.locked) {
    sh.goalieT = (sh.goalieT + dt / (CFG.GOALIE_PERIOD_MS / 1000)) % 1;
  }

  // 카운트다운
  if (!sh.ready) {
    const elapsed = now - sh.countdownStart;
    const newCount = 3 - Math.floor(elapsed / 1000);
    if (newCount < sh.countdown && newCount > 0) {
      sh.countdown = newCount;
      showCountdown(newCount);
    } else if (newCount <= 0 && sh.countdown > 0) {
      sh.countdown = 0;
      document.getElementById('countdown').style.display = 'none';
      document.getElementById('shooting-hint').textContent = '';
      sh.ready = true;
      sh.startTime = now;
      SFX.go();
    }
    return;
  }

  // 게이지 움직임
  if (!sh.locked) {
    if (sh.holdStart > 0 && now - sh.holdStart > CFG.SHOOT_HOLD_DELAY) {
      let speed = 100 / (CFG.SHOOT_PERIOD_MS / 2 / 1000); // 더 빠른 왕복
      if (sh.value > CFG.SHOOT_JACKPOT_ZONE) speed *= CFG.SHOOT_JACKPOT_MULT;
      sh.value += sh.dir * speed * dt;
      if (sh.value >= 100) { sh.value = 100; sh.dir = -1; }
      else if (sh.value <= 0) { sh.value = 0; sh.dir = 1; }
    }
  } else {
    // 결과 애니메이션
    if (sh.animPhase === 'puckFly') {
      const t = (now - sh.animStart) / 700;
      if (t >= 1) {
        if (sh.result.goal) {
          sh.animPhase = 'goal';
          sh.animStart = now;
          STATE.score += sh.result.bonus;
          STATE.stats.shootScore = sh.result.bonus;
          updateScoreDisplay();
          SFX.goal();
          showToast('⚡ GOAL! +' + sh.result.bonus, '#ffd700');
        } else {
          sh.animPhase = 'miss';
          sh.animStart = now;
          SFX.miss();
          shakeScreen();
          const msg = sh.result.reason === 'weak' ? '약한 슛...' : 'SAVED 😱';
          showToast(msg, '#ff3355');
        }
      }
    } else if (sh.animPhase === 'goal' || sh.animPhase === 'miss') {
      const t = (now - sh.animStart) / (sh.animPhase === 'goal' ? 2000 : 1500);
      if (t >= 1) {
        sh.animPhase = 'done';
        setTimeout(() => endGame(), 500);
      }
    }
  }
}

function executeShoot() {
  const sh = STATE.shoot;
  if (sh.locked) return;
  if (!sh.ready) return;

  // 홀드 시간이 100ms 미만이면 의도되지 않은 떼기로 보고 무시 (재시도 허용)
  if (sh.holdStart === 0 || performance.now() - sh.holdStart < CFG.SHOOT_HOLD_DELAY) {
    sh.holdStart = 0; // 리셋, 다시 누를 수 있게
    return;
  }

  sh.locked = true;
  const v = Math.round(sh.value);

  // 골리 위치 (-1.0 ~ +1.0 정규화, 음수=왼쪽, 양수=오른쪽)
  const goalieNorm = Math.sin(sh.goalieT * Math.PI * 2) * CFG.GOALIE_RANGE_RATIO;

  let goal = false;
  let bonus = 0;
  let reason = '';

  if (v < CFG.SHOOT_GAUGE_MIN) {
    // 게이지 부족 - 약한 슛, 무조건 세이브
    goal = false;
    reason = 'weak'; // 약한 슛
  } else {
    // 슈팅 방향과 골리 위치 비교
    const tolerance = CFG.GOALIE_CENTER_TOLERANCE;
    const isGoalieLeft = goalieNorm < -tolerance;
    const isGoalieRight = goalieNorm > tolerance;
    const isGoalieCenter = !isGoalieLeft && !isGoalieRight;

    if (isGoalieCenter) {
      // 중앙 - 50% 확률
      goal = Math.random() < 0.5;
      reason = goal ? 'lucky' : 'center_save';
    } else if ((sh.side === 'left' && isGoalieRight) || (sh.side === 'right' && isGoalieLeft)) {
      // 반대 방향 - 골인 확정
      goal = true;
      reason = 'wrong_side';
    } else {
      // 같은 방향 - 세이브 확정
      goal = false;
      reason = 'same_side';
    }

    if (goal) bonus = v * CFG.SCORE_SHOOT_MULT;
  }

  sh.result = { value: v, goal, bonus, side: sh.side, goalieNorm, reason };
  sh.animPhase = 'puckFly';
  sh.animStart = performance.now();
  document.getElementById('shooting-hint').textContent = '';
}

// ============================================================
// 렌더링
// ============================================================
function render() {
  ctx.clearRect(0, 0, W, H);

  if (STATE.phase === 'menu' || STATE.phase === 'result') {
    return;
  }

  if (STATE.phase === 'shooting') {
    renderShooting();
    return;
  }

  // === 빙판 배경 ===
  ctx.fillStyle = CFG.COL_BG_ICE;
  ctx.fillRect(0, 0, W, H);

  // 빙판 스크롤 라인
  ctx.strokeStyle = CFG.COL_BG_ICE_LINE;
  ctx.lineWidth = 2;
  for (let y = -80 + STATE.bgScrollY; y < H; y += 80) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  // 세로 가이드 라인
  ctx.strokeStyle = 'rgba(100, 130, 180, 0.15)';
  ctx.lineWidth = 1;
  for (let i=1; i<3; i++) {
    ctx.beginPath();
    ctx.moveTo(laneWidth * i, 0);
    ctx.lineTo(laneWidth * i, H);
    ctx.stroke();
  }

  // 피버 시 빙판 붉은 톤 오버레이
  if (STATE.phase === 'fever') {
    ctx.fillStyle = 'rgba(255, 50, 80, 0.15)';
    ctx.fillRect(0, 0, W, H);
  }

  // 드리블/피버 - 플레이어가 스틱으로 퍽 드리블
  if (STATE.phase === 'dribble' || STATE.phase === 'fever') {
    const now = performance.now();
    const isFever = STATE.phase === 'fever';

    // 빙판 배경 + 짧은 잔영 스크롤 (드리블 느낌)
    ctx.fillStyle = CFG.COL_BG_ICE;
    ctx.fillRect(0, 0, W, H);
    if (isFever) {
      ctx.fillStyle = 'rgba(255, 50, 80, 0.15)';
      ctx.fillRect(0, 0, W, H);
    }

    // 드리블 영역 표시 (둥근 영역)
    const dribbleY = H * 0.55;

    // 퍽 위치 보간 (탭 시점에 빠르게 이동, 그 외 천천히 복원)
    const targetPuckX = STATE.dribble.dir * 80;
    STATE.dribble.puckX += (targetPuckX - STATE.dribble.puckX) * 0.35;

    const puckX = W/2 + STATE.dribble.puckX;
    const puckY = dribbleY;

    // 퍽 그림자
    const shake = STATE.puckShake || 0;
    if (STATE.puckShake) STATE.puckShake = Math.max(0, STATE.puckShake - 0.8);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(puckX + 4, puckY + 12, 32, 9, 0, 0, Math.PI*2);
    ctx.fill();

    // 퍽 본체
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.ellipse(
      puckX + (Math.random()-0.5)*shake*0.3,
      puckY + (Math.random()-0.5)*shake*0.3,
      36, 11, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 3;
    ctx.stroke();
    // 퍽 하이라이트
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.ellipse(puckX - 6, puckY - 4, 18, 4, 0, 0, Math.PI*2);
    ctx.fill();

    // === 플레이어 (가운데, 약간 위) ===
    const playerCx = W/2;
    const playerCy = dribbleY - 110;

    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(playerCx + 4, playerCy + 42, CFG.PLAYER_RADIUS * 0.9, 10, 0, 0, Math.PI*2);
    ctx.fill();

    // === 스틱 (좌우 토글 애니메이션) ===
    // 탭 후 100ms 동안 스윙 모션
    const timeSinceHit = now - STATE.dribble.hitTime;
    const swingT = Math.max(0, Math.min(1, timeSinceHit / 120));
    const swingPower = Math.sin(swingT * Math.PI); // 0->1->0
    const stickAngle = STATE.dribble.dir * (0.5 + swingPower * 0.4); // 기본 각도 + 스윙

    ctx.save();
    ctx.translate(playerCx, playerCy + 5);
    ctx.rotate(stickAngle);

    // 스틱 손잡이
    ctx.strokeStyle = CFG.COL_PLAYER_STICK;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 105);
    ctx.stroke();

    // 스틱 블레이드 (끝 부분)
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(-2, 100);
    ctx.lineTo(22, 115);
    ctx.stroke();
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-2, 100);
    ctx.lineTo(22, 115);
    ctx.stroke();

    ctx.restore();

    // === 플레이어 헬멧 ===
    const grad = ctx.createRadialGradient(playerCx-10, playerCy-10, 5, playerCx, playerCy, CFG.PLAYER_RADIUS);
    grad.addColorStop(0, '#4a8fff');
    grad.addColorStop(1, CFG.COL_PLAYER);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(playerCx, playerCy, CFG.PLAYER_RADIUS, 0, Math.PI*2);
    ctx.fill();

    // 페이스 가드
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(playerCx, playerCy + 8, CFG.PLAYER_RADIUS * 0.55, 0.2, Math.PI - 0.2);
    ctx.fill();
    ctx.strokeStyle = '#777';
    ctx.lineWidth = 1.5;
    for (let i=0; i<3; i++) {
      ctx.beginPath();
      ctx.moveTo(playerCx - 18, playerCy + 10 + i*5);
      ctx.lineTo(playerCx + 18, playerCy + 10 + i*5);
      ctx.stroke();
    }
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('WEST', playerCx, playerCy - 10);

    // === 안내 텍스트 ===
    if (isFever) {
      ctx.shadowColor = '#ff0';
      ctx.shadowBlur = 24;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 56px sans-serif';
      ctx.fillText('🔥 FEVER 🔥', W/2, 130);
      ctx.shadowBlur = 0;
      ctx.font = 'bold 28px sans-serif';
      ctx.fillStyle = '#ff3355';
      ctx.fillText('+50 PER TAP', W/2, 175);
    } else {
      ctx.fillStyle = '#1a3060';
      ctx.font = 'bold 48px sans-serif';
      ctx.fillText('연타! 연타!', W/2, 130);
      ctx.font = 'bold 24px sans-serif';
      ctx.fillStyle = '#446';
      ctx.fillText('+30 PER TAP', W/2, 165);
    }

    // 드리블 트레일 라인 (퍽 움직임 시각화)
    ctx.strokeStyle = isFever ? 'rgba(255,100,100,0.3)' : 'rgba(100,140,200,0.3)';
    ctx.lineWidth = 4;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(W/2 - 100, dribbleY + 30);
    ctx.lineTo(W/2 + 100, dribbleY + 30);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';

    // 파티클
    renderParticles();
    return;
  }

  // === 오브젝트 ===
  for (const obs of STATE.obstacles) {
    const x = (obs.lane - 0.5) * laneWidth;
    drawObstacle(obs, x);
  }

  // === 플레이어 ===
  drawPlayer();

  // === 파티클 ===
  renderParticles();
}

function drawPlayer() {
  const p = STATE.player;
  const now = performance.now();
  let yOffset = 0;
  let scale = 1;
  // 점프 포물선
  if (now < p.jumpUntil) {
    const t = 1 - (p.jumpUntil - now) / CFG.JUMP_DURATION;
    yOffset = -Math.sin(t * Math.PI) * CFG.JUMP_HEIGHT;
    scale = 1 + Math.sin(t * Math.PI) * 0.15;
  }
  const x = p.x, y = p.y + yOffset;

  // 점프 중 지면 그림자 (실제 위치에 표시)
  if (now < p.jumpUntil) {
    const t = 1 - (p.jumpUntil - now) / CFG.JUMP_DURATION;
    const shadowAlpha = 0.25 * (1 - Math.sin(t * Math.PI) * 0.7);
    const shadowScale = 1 - Math.sin(t * Math.PI) * 0.4;
    ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 38, CFG.PLAYER_RADIUS * 0.9 * shadowScale, 10 * shadowScale, 0, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.save();
  ctx.globalAlpha = p.alpha;
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.translate(-x, -y);

  // 그림자 (지면 상태일 때만)
  if (now >= p.jumpUntil) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(x + 4, y + 38, CFG.PLAYER_RADIUS * 0.9, 10, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // 하키 스틱
  ctx.strokeStyle = CFG.COL_PLAYER_STICK;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + 18, y - 8);
  ctx.lineTo(x + 50, y + 30);
  ctx.stroke();
  // 스틱 블레이드
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(x + 48, y + 28);
  ctx.lineTo(x + 60, y + 38);
  ctx.stroke();

  // 헬멧 본체 (파란색)
  const grad = ctx.createRadialGradient(x-10, y-10, 5, x, y, CFG.PLAYER_RADIUS);
  grad.addColorStop(0, '#4a8fff');
  grad.addColorStop(1, CFG.COL_PLAYER);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, CFG.PLAYER_RADIUS, 0, Math.PI*2);
  ctx.fill();

  // 헬멧 페이스 가드 (앞면)
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(x, y + 8, CFG.PLAYER_RADIUS * 0.55, 0.2, Math.PI - 0.2);
  ctx.fill();
  // 그릴 라인
  ctx.strokeStyle = '#777';
  ctx.lineWidth = 1.5;
  for (let i=0; i<3; i++) {
    ctx.beginPath();
    ctx.moveTo(x - 18, y + 10 + i*5);
    ctx.lineTo(x + 18, y + 10 + i*5);
    ctx.stroke();
  }

  // WEST 텍스트
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('WEST', x, y - 10);

  ctx.textAlign = 'start';
  ctx.restore();
}

function drawObstacle(obs, x) {
  if (obs.type === 'cone') {
    drawCone(x, obs.y);
  } else if (obs.type === 'boss') {
    drawBoss(x, obs.y, obs.avoided);
  } else if (obs.type === 'energy') {
    drawEnergy(x, obs.y);
  }
}

function drawCone(x, y) {
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(x + 3, y + 28, 28, 6, 0, 0, Math.PI*2);
  ctx.fill();
  // 콘 본체 (삼각형)
  ctx.fillStyle = CFG.COL_CONE;
  ctx.beginPath();
  ctx.moveTo(x, y - 30);
  ctx.lineTo(x - 28, y + 25);
  ctx.lineTo(x + 28, y + 25);
  ctx.closePath();
  ctx.fill();
  // 흰 띠
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 22, y - 5, 44, 8);
  // 베이스
  ctx.fillStyle = '#cc5500';
  ctx.fillRect(x - 30, y + 22, 60, 6);
  // 외곽선
  ctx.strokeStyle = '#aa3500';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y - 30);
  ctx.lineTo(x - 28, y + 25);
  ctx.lineTo(x + 28, y + 25);
  ctx.closePath();
  ctx.stroke();
}

function drawBoss(x, y, avoided) {
  // x, y는 더 이상 사용 안 함 (lane 무시) — 화면 전체 가로 장벽
  ctx.save();
  if (avoided) ctx.globalAlpha = 0.4;

  const cx = W / 2;
  const cy = y; // y만 활용 (낙하 위치)
  const barW = W - 20; // 화면 전체 너비 - 약간 여백
  const barH = 70;

  // === 그림자 (몸 아래) ===
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(cx + 5, cy + barH/2 + 10, barW/2 * 0.85, 12, 0, 0, Math.PI*2);
  ctx.fill();

  // === 몸통 (옆으로 누운 둥글둥글한 게을킹 포즈) ===
  const bodyColor = avoided ? '#888' : '#d4a574';
  const bodyDark = avoided ? '#555' : '#a07845';

  // 몸통 메인 (둥근 직사각형)
  ctx.fillStyle = bodyColor;
  roundRect(cx - barW/2, cy - barH/2, barW, barH, 35);
  ctx.fill();

  // 배 흰색 (게을킹 배)
  ctx.fillStyle = avoided ? '#aaa' : '#f0d8b8';
  roundRect(cx - barW/2 + 60, cy - barH/2 + 15, barW - 120, barH - 30, 20);
  ctx.fill();

  // === 양팔 (좌우 끝으로 뻗은 게을킹 손) ===
  ctx.fillStyle = bodyColor;
  // 왼손
  ctx.beginPath();
  ctx.arc(cx - barW/2 + 15, cy, 28, 0, Math.PI*2);
  ctx.fill();
  // 오른손
  ctx.beginPath();
  ctx.arc(cx + barW/2 - 15, cy, 28, 0, Math.PI*2);
  ctx.fill();
  // 손가락 (3개씩, 양쪽)
  ctx.fillStyle = bodyDark;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(cx - barW/2 + 8, cy - 12 + i * 12, 5, 0, Math.PI*2);
    ctx.arc(cx + barW/2 - 8, cy - 12 + i * 12, 5, 0, Math.PI*2);
    ctx.fill();
  }

  // === 외곽선 ===
  ctx.strokeStyle = bodyDark;
  ctx.lineWidth = 2.5;
  roundRect(cx - barW/2, cy - barH/2, barW, barH, 35);
  ctx.stroke();

  // === 감독 얼굴 (중앙에 배치) ===
  const faceX = cx;
  const faceY = cy - 5;
  const faceR = 30;

  // 얼굴 베이스
  ctx.fillStyle = avoided ? '#999' : '#e8b888';
  ctx.beginPath();
  ctx.arc(faceX, faceY, faceR, 0, Math.PI*2);
  ctx.fill();

  // 머리카락 (옆머리 + 위)
  ctx.fillStyle = avoided ? '#444' : '#2a1a0a';
  ctx.beginPath();
  ctx.arc(faceX, faceY - 8, faceR, Math.PI * 1.05, Math.PI * 1.95);
  ctx.fill();
  // 옆머리 디테일
  ctx.beginPath();
  ctx.arc(faceX - 24, faceY - 5, 8, 0, Math.PI*2);
  ctx.arc(faceX + 24, faceY - 5, 8, 0, Math.PI*2);
  ctx.fill();

  // 눈썹 (화남)
  ctx.strokeStyle = avoided ? '#333' : '#1a0a00';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(faceX - 16, faceY - 3);
  ctx.lineTo(faceX - 5, faceY);
  ctx.moveTo(faceX + 16, faceY - 3);
  ctx.lineTo(faceX + 5, faceY);
  ctx.stroke();

  // 눈
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(faceX - 10, faceY + 4, 3, 0, Math.PI*2);
  ctx.arc(faceX + 10, faceY + 4, 3, 0, Math.PI*2);
  ctx.fill();

  // 입 (벌리고 호통)
  ctx.fillStyle = '#5a1010';
  ctx.beginPath();
  ctx.ellipse(faceX, faceY + 16, 8, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 호루라기 (회피 안된 상태에서만)
  if (!avoided) {
    ctx.fillStyle = '#c0c0c0';
    ctx.beginPath();
    ctx.arc(faceX + 25, faceY + 14, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 호루라기 줄
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(faceX + 18, faceY + 14);
    ctx.lineTo(faceX + 10, faceY + 8);
    ctx.stroke();
  }

  // === 경고 화살표 (점프 유도, 회피 전에만) ===
  if (!avoided) {
    const arrowY = cy - barH/2 - 18;
    const pulse = (Math.sin(performance.now() * 0.008) + 1) / 2;
    ctx.fillStyle = `rgba(255, 60, 60, ${0.6 + pulse * 0.4})`;
    ctx.beginPath();
    ctx.moveTo(cx, arrowY);
    ctx.lineTo(cx - 12, arrowY - 14);
    ctx.lineTo(cx + 12, arrowY - 14);
    ctx.closePath();
    ctx.fill();
    // "JUMP!" 텍스트
    ctx.fillStyle = `rgba(255, 60, 60, ${0.7 + pulse * 0.3})`;
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('JUMP!', cx, arrowY - 22);
    ctx.textAlign = 'start';
  }

  ctx.restore();
}

// 둥근 사각형 그리기 헬퍼
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawEnergy(x, y) {
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x + 3, y + 28, 18, 5, 0, 0, Math.PI*2);
  ctx.fill();
  // 캔 본체
  const grad = ctx.createLinearGradient(x - 18, y, x + 18, y);
  grad.addColorStop(0, '#0a3010');
  grad.addColorStop(0.5, '#1a8030');
  grad.addColorStop(1, '#0a3010');
  ctx.fillStyle = grad;
  ctx.fillRect(x - 16, y - 28, 32, 56);
  // 상단/하단 캡
  ctx.fillStyle = '#888';
  ctx.fillRect(x - 16, y - 28, 32, 5);
  ctx.fillRect(x - 16, y + 23, 32, 5);
  // M 마크
  ctx.fillStyle = CFG.COL_ENERGY;
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('M', x, y);
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
  // 빛나는 효과
  ctx.strokeStyle = 'rgba(0, 255, 100, 0.6)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x - 17, y - 29, 34, 58);
  // 글로우
  ctx.save();
  ctx.shadowColor = '#00ff80';
  ctx.shadowBlur = 12;
  ctx.strokeStyle = 'rgba(0,255,128,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x - 17, y - 29, 34, 58);
  ctx.restore();
}

function renderParticles() {
  for (const p of STATE.particles) {
    const alpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// 슈팅 미션 렌더링
// ============================================================
function renderShooting() {
  const sh = STATE.shoot;
  const now = performance.now();

  // 어두운 배경
  ctx.fillStyle = '#0a0f1c';
  ctx.fillRect(0, 0, W, H);

  // === 좌/우 영역 분할 표시 (준비 완료 후 항상) ===
  if (sh.ready && !sh.locked) {
    const isHolding = sh.holdStart > 0;
    // 왼쪽 영역
    const leftAlpha = !isHolding ? 0.1 : (sh.side === 'left' ? 0.3 : 0.05);
    ctx.fillStyle = `rgba(100, 180, 255, ${leftAlpha})`;
    ctx.fillRect(0, 0, W/2, H);
    // 오른쪽 영역
    const rightAlpha = !isHolding ? 0.1 : (sh.side === 'right' ? 0.3 : 0.05);
    ctx.fillStyle = `rgba(255, 180, 100, ${rightAlpha})`;
    ctx.fillRect(W/2, 0, W/2, H);
    // 가운데 구분선
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 8]);
    ctx.beginPath();
    ctx.moveTo(W/2, 0);
    ctx.lineTo(W/2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // 영역 라벨
    if (isHolding) {
      ctx.font = 'bold 38px sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 12;
      ctx.fillStyle = sh.side === 'left' ? 'rgba(180, 230, 255, 1)' : 'rgba(180, 230, 255, 0.35)';
      ctx.fillText('← 왼쪽', W/4, H * 0.45);
      ctx.fillStyle = sh.side === 'right' ? 'rgba(255, 220, 180, 1)' : 'rgba(255, 220, 180, 0.35)';
      ctx.fillText('오른쪽 →', W*3/4, H * 0.45);
      ctx.shadowBlur = 0;
      ctx.textAlign = 'start';
    }
  }

  // 빙판 (희미하게)
  ctx.fillStyle = 'rgba(180, 200, 240, 0.1)';
  ctx.fillRect(0, H * 0.55, W, H * 0.45);

  // === 골대 ===
  const goalY = H * 0.18;
  const goalW = W * 0.65;
  const goalX = (W - goalW) / 2;
  const goalH = 110;

  // 그물 음영
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(goalX, goalY, goalW, goalH);

  // 그물 라인
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  for (let i=0; i<10; i++) {
    ctx.beginPath();
    ctx.moveTo(goalX + (goalW / 10) * i, goalY);
    ctx.lineTo(goalX + (goalW / 10) * i, goalY + goalH);
    ctx.stroke();
  }
  for (let i=0; i<6; i++) {
    ctx.beginPath();
    ctx.moveTo(goalX, goalY + (goalH / 6) * i);
    ctx.lineTo(goalX + goalW, goalY + (goalH / 6) * i);
    ctx.stroke();
  }

  // 골인 시 그물 흔들림
  let goalShake = 0;
  if (sh.animPhase === 'goal') {
    goalShake = Math.sin((now - sh.animStart) * 0.03) * 8;
  }

  // 골 프레임
  ctx.strokeStyle = '#cc0000';
  ctx.lineWidth = 8;
  ctx.strokeRect(goalX + goalShake, goalY, goalW, goalH);

  // === 골리 (좌우 움직임) ===
  const goalieCenter = goalX + goalW / 2;
  const goalieMaxOffset = (goalW / 2) * CFG.GOALIE_RANGE_RATIO;
  let goalieX, goalieY;

  if (sh.locked && sh.result) {
    // 슛 발사 시점 위치 고정 (사인 사용)
    const lockedNorm = Math.sin(sh.goalieT * Math.PI * 2) * CFG.GOALIE_RANGE_RATIO;
    goalieX = goalieCenter + lockedNorm * (goalW / 2);
    goalieY = goalY + goalH/2 + 25;

    // 미스 애니메이션
    if (sh.animPhase === 'miss') {
      const t = Math.min(1, (now - sh.animStart) / 1500);
      if (sh.result.reason === 'same_side' || sh.result.reason === 'center_save') {
        // 골리가 다이빙으로 쳐냄 - 슈팅 방향 쪽으로 살짝 더 이동
        const dive = sh.result.side === 'left' ? -25 : 25;
        goalieX += dive * Math.sin(t * Math.PI);
        goalieY += Math.sin(t * Math.PI) * 15;
      }
    }
    if (sh.animPhase === 'goal') {
      // 골리가 뒤로 무너짐
      const t = Math.min(1, (now - sh.animStart) / 2000);
      goalieY += t * 60;
    }
  } else {
    // 현재 골리 위치
    const norm = Math.sin(sh.goalieT * Math.PI * 2) * CFG.GOALIE_RANGE_RATIO;
    goalieX = goalieCenter + norm * (goalW / 2);
    goalieY = goalY + goalH/2 + 25;
  }
  drawGoalie(goalieX, goalieY);

  // === 퍽 ===
  let puckX = W/2, puckY = H * 0.75;
  if (sh.animPhase === 'puckFly') {
    const t = (now - sh.animStart) / 700;
    // 슛 방향에 따라 좌/우로 살짝 휘면서 골대로
    const targetX = sh.result.side === 'left' ? goalX + goalW * 0.2 : goalX + goalW * 0.8;
    puckX = W/2 + (targetX - W/2) * t;
    puckY = H * 0.75 + (goalY + goalH/2 - H * 0.75) * t;
  } else if (sh.animPhase === 'goal') {
    const targetX = sh.result.side === 'left' ? goalX + goalW * 0.2 : goalX + goalW * 0.8;
    puckX = targetX;
    puckY = goalY + goalH/2;
  } else if (sh.animPhase === 'miss') {
    puckX = goalieX;
    puckY = goalieY;
  }

  // 퍽 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(puckX + 3, puckY + 14, 22, 6, 0, 0, Math.PI*2);
  ctx.fill();
  // 퍽
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(puckX, puckY, 24, 8, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.stroke();

  // === 게이지 (준비 완료 후 항상 표시, 누르기 전엔 0 정지) ===
  if (sh.ready && !sh.locked) {
    drawGaugeHorizontal(sh.value, sh.value > CFG.SHOOT_JACKPOT_ZONE);
  }

  // === 안내 텍스트 ===
  if (sh.ready && !sh.locked) {
    if (sh.holdStart === 0) {
      // 누르기 대기 - 화면 가운데 큰 안내
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 20;
      ctx.fillText('🥅 골리를 속여라!', W/2, H * 0.52);
      ctx.shadowBlur = 0;
      ctx.font = 'bold 22px sans-serif';
      ctx.fillStyle = '#88ccff';
      ctx.fillText('화면 좌측 또는 우측을', W/2, H * 0.58);
      ctx.fillText('꾹 누르고 떼세요', W/2, H * 0.62);
      // 펄스 화살표
      const pulse = (Math.sin(now * 0.005) + 1) / 2;
      ctx.fillStyle = `rgba(255, 215, 0, ${0.6 + pulse * 0.4})`;
      ctx.font = 'bold 48px sans-serif';
      ctx.fillText('👇', W/4, H * 0.72);
      ctx.fillText('👇', W*3/4, H * 0.72);
      ctx.textAlign = 'start';
    } else {
      // 누르는 중 - 게이지 안내
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 8;
      ctx.fillText('💪 게이지가 빨라요! 타이밍 맞춰 떼세요!', W/2, H * 0.92);
      ctx.shadowBlur = 0;
      ctx.textAlign = 'start';
    }
  }

  // === 상단 점수 ===
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('현재 점수: ' + STATE.score, 20, 32);
  ctx.textAlign = 'start';
}

// 가로형 게이지 (슈팅 미션 전용)
function drawGaugeHorizontal(value, isJackpot) {
  const gx = W / 2;
  const gy = 60;
  const gw = W * 0.7;
  const gh = 28;
  const now = performance.now();

  // 배경
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(gx - gw/2, gy - gh/2, gw, gh);

  // 컬러 존
  const zones = [
    [0, 50, '#444'],
    [50, 80, '#cc9900'],
    [80, 95, '#cc5500'],
    [95, 100, now % 200 < 100 ? '#ff0000' : '#aa0000'],
  ];
  for (const [from, to, col] of zones) {
    ctx.fillStyle = col;
    const x1 = gx - gw/2 + (from/100) * gw;
    const x2 = gx - gw/2 + (to/100) * gw;
    ctx.fillRect(x1, gy - gh/2, x2 - x1, gh);
  }

  // 잔상 (왕복 시각화)
  const sh = STATE.shoot;
  for (let i = 1; i <= 5; i++) {
    const trailT = i * 18;
    const speed = (sh.value > CFG.SHOOT_JACKPOT_ZONE) ? CFG.SHOOT_JACKPOT_MULT : 1;
    const baseSpeed = 100 / (CFG.SHOOT_PERIOD_MS / 2 / 1000);
    const deltaV = baseSpeed * speed * (trailT/1000) * sh.dir;
    let trailV = sh.value - deltaV;
    if (trailV < 0) trailV = -trailV;
    if (trailV > 100) trailV = 200 - trailV;
    trailV = Math.max(0, Math.min(100, trailV));
    const alpha = (1 - i/6) * 0.5;
    const trailX = gx - gw/2 + (trailV/100) * gw;
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(trailX, gy, 5 + (1 - i/6) * 4, 0, Math.PI*2);
    ctx.fill();
  }

  // 외곽선
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeRect(gx - gw/2, gy - gh/2, gw, gh);

  // 현재 화살표
  const arrowX = gx - gw/2 + (value/100) * gw;
  ctx.save();
  ctx.shadowColor = '#ffff00';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#ffff00';
  ctx.beginPath();
  ctx.moveTo(arrowX, gy - gh/2 - 5);
  ctx.lineTo(arrowX - 10, gy - gh/2 - 22);
  ctx.lineTo(arrowX + 10, gy - gh/2 - 22);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 숫자
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 8;
  ctx.fillText(Math.round(value), arrowX, gy + 50);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'start';

  // 눈금
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  for (let v=0; v<=100; v+=25) {
    const xx = gx - gw/2 + (v/100) * gw;
    ctx.beginPath();
    ctx.moveTo(xx, gy + gh/2);
    ctx.lineTo(xx, gy + gh/2 + 6);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(v, xx, gy + gh/2 + 18);
    ctx.textAlign = 'start';
  }
}

function drawGoalie(x, y) {
  // 몸통
  ctx.fillStyle = '#2a4080';
  ctx.fillRect(x - 30, y - 35, 60, 65);
  // 머리
  ctx.fillStyle = '#d4a574';
  ctx.beginPath();
  ctx.arc(x, y - 45, 18, 0, Math.PI*2);
  ctx.fill();
  // 마스크
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x, y - 42, 14, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  for (let i=0; i<3; i++) {
    ctx.fillRect(x - 10 + i*7, y - 45, 2, 8);
  }
  // 글러브 (양쪽 팔)
  ctx.fillStyle = '#dd2222';
  ctx.beginPath();
  ctx.arc(x - 38, y - 5, 14, 0, Math.PI*2);
  ctx.arc(x + 38, y - 5, 14, 0, Math.PI*2);
  ctx.fill();
  // 다리
  ctx.fillStyle = '#2a4080';
  ctx.fillRect(x - 24, y + 30, 18, 25);
  ctx.fillRect(x + 6, y + 30, 18, 25);
}

function drawGauge(value, locked=false) {
  const gx = W - 80;
  const gy = H * 0.5;
  const gw = 50;
  const gh = H * 0.55;

  // 배경
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(gx - gw/2, gy - gh/2, gw, gh);

  // 컬러 존
  const zones = [
    [0, 50, '#444'],
    [50, 80, '#cc9900'],
    [80, 95, '#cc5500'],
    [95, 100, performance.now() % 200 < 100 ? '#ff0000' : '#aa0000'],
  ];
  for (const [from, to, col] of zones) {
    ctx.fillStyle = col;
    const y1 = gy + gh/2 - (from/100) * gh;
    const y2 = gy + gh/2 - (to/100) * gh;
    ctx.fillRect(gx - gw/2, y2, gw, y1 - y2);
  }

  // === 잔상 효과 (locked 아닐 때만) ===
  if (!locked) {
    // 잔상 위치 계산: 최근 5개 위치를 sin 곡선으로 시뮬레이션
    const sh = STATE.shoot;
    const now = performance.now();
    for (let i = 1; i <= 6; i++) {
      const trailT = i * 25; // 25ms씩 과거
      // 과거 위치 추정 (현재 dir 기준 역산)
      const speed = (sh.value > CFG.SHOOT_JACKPOT_ZONE) ? CFG.SHOOT_JACKPOT_MULT : 1;
      const baseSpeed = 100 / (CFG.SHOOT_PERIOD_MS / 2 / 1000);
      const deltaV = baseSpeed * speed * (trailT/1000) * sh.dir;
      let trailV = sh.value - deltaV;
      // 0~100 바운스 처리
      if (trailV < 0) trailV = -trailV;
      if (trailV > 100) trailV = 200 - trailV;
      trailV = Math.max(0, Math.min(100, trailV));

      const alpha = (1 - i/7) * 0.4;
      const trailY = gy + gh/2 - (trailV/100) * gh;
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(gx, trailY, 6 + (1 - i/7) * 4, 0, Math.PI*2);
      ctx.fill();
    }

    // 양옆 스피드 라인 (왕복 강조)
    const speedPulse = (Math.sin(now * 0.025) + 1) / 2;
    ctx.strokeStyle = `rgba(255, 220, 50, ${0.4 + speedPulse * 0.5})`;
    ctx.lineWidth = 2;
    for (let j = 0; j < 3; j++) {
      const yPos = gy - gh/2 + (j * gh / 3) + (now * 0.5 % (gh/3));
      ctx.beginPath();
      ctx.moveTo(gx + gw/2 + 5, yPos);
      ctx.lineTo(gx + gw/2 + 12, yPos);
      ctx.moveTo(gx - gw/2 - 12, yPos);
      ctx.lineTo(gx - gw/2 - 5, yPos);
      ctx.stroke();
    }
  }

  // 외곽선
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeRect(gx - gw/2, gy - gh/2, gw, gh);

  // 현재 화살표 (메인)
  const arrowY = gy + gh/2 - (value/100) * gh;
  // 화살표 글로우
  if (!locked) {
    ctx.save();
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#ffff00';
    ctx.beginPath();
    ctx.moveTo(gx - gw/2 - 5, arrowY);
    ctx.lineTo(gx - gw/2 - 28, arrowY - 14);
    ctx.lineTo(gx - gw/2 - 28, arrowY + 14);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  } else {
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(gx - gw/2 - 5, arrowY);
    ctx.lineTo(gx - gw/2 - 28, arrowY - 14);
    ctx.lineTo(gx - gw/2 - 28, arrowY + 14);
    ctx.closePath();
    ctx.fill();
  }

  // 숫자 표시 (큼직하게)
  ctx.fillStyle = locked ? '#ffd700' : '#fff';
  ctx.font = 'bold 42px sans-serif';
  ctx.textAlign = 'center';
  // 숫자 글로우
  if (!locked) {
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 20;
  }
  ctx.fillText(Math.round(value), gx, gy + gh/2 + 52);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'start';

  // 눈금
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  for (let v=0; v<=100; v+=25) {
    const yy = gy + gh/2 - (v/100) * gh;
    ctx.beginPath();
    ctx.moveTo(gx + gw/2, yy);
    ctx.lineTo(gx + gw/2 + 8, yy);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(v, gx + gw/2 + 10, yy + 5);
  }

  // 게이지 위 "고고고!" 표시 (locked 아닐 때 깜빡임)
  if (!locked) {
    const blink = Math.sin(performance.now() * 0.015) > 0;
    if (blink) {
      ctx.fillStyle = '#ff3355';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('지금!', gx, gy - gh/2 - 12);
      ctx.textAlign = 'start';
    }
  }
}

// ============================================================
// 종료 및 결과
// ============================================================
function endGame() {
  STATE.phase = 'result';
  document.getElementById('shooting-ui').classList.remove('active');
  document.getElementById('hud').style.display = 'none';
  document.getElementById('result-screen').classList.remove('hidden');

  // 점수 표시
  const scoreEl = document.getElementById('result-score');
  scoreEl.textContent = STATE.score;
  if (STATE.score < 0) scoreEl.classList.add('negative');
  else scoreEl.classList.remove('negative');

  // 점수 카운트업
  let cur = 0;
  const target = STATE.score;
  const startVal = 0;
  const duration = 1500;
  const tStart = performance.now();
  function tick() {
    const t = Math.min(1, (performance.now() - tStart) / duration);
    cur = Math.round(startVal + (target - startVal) * t);
    scoreEl.textContent = cur;
    if (t < 1) requestAnimationFrame(tick);
  }
  tick();

  // 분해 점수
  const trainingScore = STATE.stats.coneNormal * CFG.SCORE_CONE +
                        STATE.stats.coneCombo * CFG.SCORE_CONE_COMBO +
                        STATE.stats.bossNormal * CFG.SCORE_BOSS +
                        STATE.stats.bossCombo * CFG.SCORE_BOSS_COMBO +
                        STATE.stats.energy * CFG.SCORE_ENERGY +
                        STATE.stats.hits * CFG.PENALTY_HIT;
  const dribbleScore = STATE.stats.normalTaps * CFG.SCORE_TAP_NORMAL;
  const feverScore = STATE.stats.feverTaps * CFG.SCORE_TAP_FEVER;
  const shootScore = STATE.stats.shootScore;

  document.getElementById('result-breakdown').innerHTML = `
    <div class="result-row"><span class="label">훈련 (패턴 ${STATE.patternKey})</span><span>${trainingScore}점</span></div>
    <div class="result-row"><span class="label">드리블 (${STATE.stats.normalTaps}탭)</span><span>${dribbleScore}점</span></div>
    <div class="result-row"><span class="label">피버 (${STATE.stats.feverTaps}탭)</span><span>${feverScore}점</span></div>
    <div class="result-row"><span class="label">슈팅</span><span>${shootScore}점</span></div>
    <div class="result-row" style="border-top:1px solid rgba(255,255,255,0.2); margin-top:8px; padding-top:12px;"><span class="label">충돌 ${STATE.stats.hits}회</span><span style="color:#ff8888">${STATE.stats.hits * CFG.PENALTY_HIT}점</span></div>
  `;

  document.getElementById('name-input').value = '';
}

// ============================================================
// 순위표
// ============================================================
const RANK_KEY = 'westHockeyRanking';

function loadRanking() {
  try {
    return JSON.parse(localStorage.getItem(RANK_KEY) || '[]');
  } catch(e) { return []; }
}

function saveRanking(name, score) {
  const list = loadRanking();
  list.push({ name, score, date: new Date().toISOString().slice(0,10) });
  list.sort((a,b) => b.score - a.score);
  localStorage.setItem(RANK_KEY, JSON.stringify(list.slice(0, 20)));
}

function renderRanking() {
  const list = loadRanking().slice(0, 5);
  const el = document.getElementById('ranking-list');
  if (list.length === 0) {
    el.innerHTML = '<div class="ranking-empty">첫 도전자가 되어보세요!</div>';
    return;
  }
  el.innerHTML = list.map((r, i) => `
    <div class="ranking-row">
      <span class="rank">${i+1}위</span>
      <span class="name">${escapeHtml(r.name)}</span>
      <span class="score">${r.score}점</span>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// 이벤트 바인딩
// ============================================================
document.getElementById('start-btn').addEventListener('click', (e) => {
  e.preventDefault();
  initAudio();
  startGame();
});
document.getElementById('start-btn').addEventListener('touchend', (e) => {
  e.preventDefault();
  initAudio();
  startGame();
});

document.getElementById('save-btn').addEventListener('click', (e) => {
  e.preventDefault();
  const name = document.getElementById('name-input').value.trim().slice(0, 5) || '익명';
  saveRanking(name, STATE.score);
  renderRanking();
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('start-screen').classList.remove('hidden');
  STATE.phase = 'menu';
});

document.getElementById('retry-btn').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('result-screen').classList.add('hidden');
  startGame();
});

// 페이지 로드 시
renderRanking();
