<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WEST HOCKEY MT 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* Color System - Frozen Stadium */
    --c-bg-deep: #050816;
    --c-bg-mid: #0a1024;
    --c-bg-elev: #131c3a;
    --c-ice: #e8f4ff;
    --c-ice-line: #6a9fd4;
    --c-primary: #4d9fff;
    --c-primary-glow: #00d4ff;
    --c-accent: #ff2d55;
    --c-accent-glow: #ff5577;
    --c-gold: #ffc940;
    --c-gold-glow: #ffe066;
    --c-success: #00e676;
    --c-danger: #ff3355;
    --c-text: #ffffff;
    --c-text-dim: rgba(255,255,255,0.65);
    --c-text-faint: rgba(255,255,255,0.4);
    --c-glass: rgba(255,255,255,0.06);
    --c-glass-border: rgba(255,255,255,0.12);

    --shadow-glow: 0 0 40px rgba(77, 159, 255, 0.4);
    --shadow-card: 0 12px 48px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.08);
    --shadow-text: 0 2px 16px rgba(0,0,0,0.8);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--c-bg-deep);
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    font-weight: 500;
    touch-action: none;
    color: var(--c-text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  #app {
    position: relative;
    width: 100vw; height: 100vh;
    max-width: 100vw; max-height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(77, 159, 255, 0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(255, 45, 85, 0.08) 0%, transparent 50%),
      linear-gradient(180deg, var(--c-bg-deep) 0%, var(--c-bg-mid) 50%, var(--c-bg-deep) 100%);
  }
  #game-canvas {
    display: block;
    width: 100%; height: 100%;
    background: transparent;
    position: relative;
    z-index: 1;
  }

  /* === 상단 HUD === */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 20px 24px;
    z-index: 10;
    pointer-events: none;
  }
  .hud-card {
    background: rgba(5, 8, 22, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--c-glass-border);
    border-radius: 16px;
    padding: 10px 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .hud-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--c-text-faint);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  #score-display {
    color: var(--c-primary-glow);
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -1px;
    text-shadow: 0 0 24px rgba(0, 212, 255, 0.6);
    transition: color 0.2s, text-shadow 0.2s;
    line-height: 1;
  }
  #score-display.negative {
    color: var(--c-danger);
    text-shadow: 0 0 24px rgba(255, 51, 85, 0.8);
  }
  #timer-display {
    color: var(--c-gold);
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -1px;
    text-shadow: 0 0 20px rgba(255, 201, 64, 0.5);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #combo-display {
    position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
    font-size: 56px; font-weight: 900;
    color: var(--c-gold-glow);
    text-shadow: 0 4px 24px rgba(0,0,0,0.9), 0 0 32px rgba(255, 201, 64, 0.9);
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    letter-spacing: 4px;
    font-style: italic;
  }
  #combo-display.show { animation: comboFlash 1s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes comboFlash {
    0% { opacity: 0; transform: translateX(-50%) scale(0.3) rotate(-5deg); }
    30% { opacity: 1; transform: translateX(-50%) scale(1.3) rotate(2deg); }
    60% { opacity: 1; transform: translateX(-50%) scale(1) rotate(0); }
    100% { opacity: 0; transform: translateX(-50%) scale(0.9) rotate(0); }
  }

  /* === 화면 흔들기 === */
  #app.shake { animation: shake 0.2s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-14px) rotate(-0.5deg); }
    40% { transform: translateX(12px) rotate(0.5deg); }
    60% { transform: translateX(-8px) rotate(-0.3deg); }
    80% { transform: translateX(6px); }
  }

  /* === 피버 오버레이 === */
  #fever-overlay {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 30% 50%, rgba(255, 45, 85, 0.45) 0%, transparent 50%),
      radial-gradient(circle at 70% 50%, rgba(255, 100, 30, 0.4) 0%, transparent 50%);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    mix-blend-mode: screen;
  }
  #fever-overlay.active { animation: feverStrobe 0.3s infinite alternate; }
  @keyframes feverStrobe {
    0% { opacity: 0.3; }
    100% { opacity: 0.9; }
  }

  /* === 시작/결과 화면 === */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(77, 159, 255, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 80%, rgba(255, 45, 85, 0.12) 0%, transparent 60%),
      linear-gradient(180deg, var(--c-bg-deep) 0%, var(--c-bg-mid) 100%);
    padding: 40px 24px;
  }
  .screen.hidden { display: none; }
  /* 빙판 노이즈 텍스처 */
  .screen::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(45deg, transparent 0, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px),
      repeating-linear-gradient(-45deg, transparent 0, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px);
    pointer-events: none;
  }
  /* 글로우 라인 데코 */
  .screen::after {
    content: '';
    position: absolute;
    top: 50%; left: -50%; right: -50%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--c-primary-glow), transparent);
    opacity: 0.3;
    pointer-events: none;
  }

  /* === 시작 화면 컴포넌트 === */
  .brand-badge {
    display: inline-block;
    padding: 6px 16px;
    border: 1px solid var(--c-primary);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--c-primary-glow);
    margin-bottom: 24px;
    background: rgba(77, 159, 255, 0.08);
    backdrop-filter: blur(10px);
    text-transform: uppercase;
    z-index: 1;
    position: relative;
  }

  .title-wrap {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-bottom: 8px;
  }
  .title {
    font-size: 68px;
    font-weight: 900;
    color: var(--c-text);
    letter-spacing: -2px;
    line-height: 0.95;
    text-shadow:
      0 0 32px rgba(77, 159, 255, 0.5),
      0 0 64px rgba(77, 159, 255, 0.25);
    margin: 0;
  }
  .title-accent {
    color: var(--c-primary-glow);
    font-style: italic;
  }
  .title-year {
    font-size: 24px;
    font-weight: 300;
    color: var(--c-text-dim);
    letter-spacing: 12px;
    margin-top: 8px;
    padding-left: 12px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--c-text-faint);
    letter-spacing: 8px;
    margin-bottom: 36px;
    font-weight: 500;
    text-transform: uppercase;
    z-index: 1;
    position: relative;
  }

  .ranking-box {
    background: var(--c-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--c-glass-border);
    border-radius: 20px;
    padding: 24px 28px 20px;
    min-width: 340px;
    max-width: 90vw;
    margin-bottom: 36px;
    box-shadow: var(--shadow-card);
    z-index: 1;
    position: relative;
  }
  .ranking-title {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .ranking-title-text {
    color: var(--c-gold);
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .ranking-title-icon {
    color: var(--c-gold);
    font-size: 18px;
  }
  .ranking-row {
    display: flex; align-items: center;
    color: var(--c-text); font-size: 16px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-weight: 500;
  }
  .ranking-row:last-child { border-bottom: none; }
  .ranking-row .rank {
    color: var(--c-text-faint);
    width: 32px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .ranking-row:nth-child(1) .rank { color: var(--c-gold); }
  .ranking-row .name {
    flex: 1; padding-left: 8px;
    font-weight: 700;
  }
  .ranking-row .score {
    color: var(--c-primary-glow);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
  }
  .ranking-empty { color: var(--c-text-faint); text-align: center; font-size: 14px; padding: 20px 0; letter-spacing: 1px; }

  .btn-primary {
    background: linear-gradient(135deg, var(--c-accent) 0%, #ff6b35 100%);
    color: var(--c-text);
    border: none;
    padding: 20px 56px;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 4px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow:
      0 12px 32px rgba(255, 45, 85, 0.4),
      inset 0 1px 0 rgba(255,255,255,0.35),
      inset 0 -2px 0 rgba(0,0,0,0.15);
    transition: transform 0.1s, box-shadow 0.2s;
    font-family: inherit;
    z-index: 1;
    position: relative;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .btn-primary:active {
    transform: scale(0.96) translateY(2px);
    box-shadow: 0 6px 16px rgba(255, 45, 85, 0.5), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .guide-text {
    margin-top: 32px;
    color: var(--c-text-dim);
    font-size: 13px;
    line-height: 2;
    text-align: center;
    letter-spacing: 0.5px;
    font-weight: 500;
    z-index: 1;
    position: relative;
    max-width: 320px;
  }
  .guide-text b {
    color: var(--c-primary-glow);
    font-weight: 700;
  }

  /* === 결과 화면 === */
  .result-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 8px;
    color: var(--c-text-faint);
    text-transform: uppercase;
    margin-bottom: 4px;
    z-index: 1;
    position: relative;
  }
  .result-score {
    font-size: 96px;
    font-weight: 900;
    color: var(--c-gold);
    text-shadow:
      0 0 40px rgba(255, 201, 64, 0.7),
      0 0 80px rgba(255, 201, 64, 0.3);
    margin: 8px 0 28px;
    letter-spacing: -3px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    z-index: 1;
    position: relative;
  }
  .result-score.negative {
    color: var(--c-danger);
    text-shadow: 0 0 40px rgba(255, 51, 85, 0.7);
  }
  .result-breakdown {
    background: var(--c-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--c-glass-border);
    border-radius: 16px;
    padding: 20px 28px;
    margin-bottom: 28px;
    min-width: 320px;
    max-width: 90vw;
    z-index: 1;
    position: relative;
    box-shadow: var(--shadow-card);
  }
  .result-row {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--c-text); font-size: 14px;
    padding: 8px 0;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .result-row .label {
    color: var(--c-text-dim);
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .result-row .value {
    font-weight: 700;
    color: var(--c-text);
  }

  .name-input {
    margin-bottom: 20px;
    text-align: center;
    z-index: 1;
    position: relative;
  }
  .name-input input {
    background: var(--c-glass);
    backdrop-filter: blur(20px);
    border: 1.5px solid var(--c-primary);
    color: var(--c-text);
    padding: 16px 24px;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    border-radius: 12px;
    width: 220px;
    letter-spacing: 4px;
    font-family: inherit;
    outline: none;
    box-shadow: 0 0 24px rgba(77, 159, 255, 0.2);
  }
  .name-input input::placeholder {
    color: var(--c-text-faint);
    letter-spacing: 2px;
    font-weight: 500;
  }
  .name-input input:focus {
    border-color: var(--c-primary-glow);
    box-shadow: 0 0 32px rgba(0, 212, 255, 0.4);
  }

  .result-buttons {
    display: flex; gap: 12px;
    z-index: 1;
    position: relative;
  }
  .btn-secondary {
    background: var(--c-glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--c-glass-border);
    color: var(--c-text);
    padding: 14px 28px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    text-transform: uppercase;
  }
  .btn-secondary:active { transform: scale(0.96); background: rgba(255,255,255,0.12); }

  /* === 카운트다운 === */
  #countdown {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
    pointer-events: none;
  }
  #countdown-num {
    font-size: 240px;
    font-weight: 900;
    color: var(--c-text);
    text-shadow:
      0 0 60px var(--c-primary-glow),
      0 0 120px rgba(0, 212, 255, 0.5);
    opacity: 0;
    pointer-events: none;
    font-style: italic;
    letter-spacing: -8px;
  }
  #countdown-num.show { animation: countdownPulse 1s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes countdownPulse {
    0% { opacity: 0; transform: scale(2.5) rotate(-10deg); }
    30% { opacity: 1; transform: scale(1) rotate(0); }
    100% { opacity: 0; transform: scale(0.7); }
  }

  /* === 슈팅 미션 UI === */
  #shooting-ui {
    position: absolute; inset: 0;
    z-index: 30;
    pointer-events: none;
    display: none;
  }
  #shooting-ui.active { display: block; pointer-events: none; }
  #shooting-hint {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--c-text); font-size: 32px; font-weight: 900;
    text-shadow: 0 0 24px rgba(0,0,0,0.9);
    letter-spacing: 4px;
    text-align: center;
    pointer-events: none;
  }

  #toast {
    position: absolute; top: 32%; left: 50%; transform: translateX(-50%);
    color: var(--c-text);
    font-size: 44px;
    font-weight: 900;
    text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    letter-spacing: 2px;
    text-align: center;
    white-space: nowrap;
  }
  #toast.show { animation: toastPop 1.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes toastPop {
    0% { opacity: 0; transform: translate(-50%, 30px) scale(0.5); }
    20% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
    35% { transform: translate(-50%, 0) scale(1); }
    80% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -20px) scale(0.95); }
  }

  /* 배경 데코 - 일렉트릭 라인 */
  .deco-line {
    position: absolute;
    background: linear-gradient(90deg, transparent, var(--c-primary), transparent);
    height: 1px;
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
  }

  /* 시작화면 풋터 */
  .footer-mark {
    position: absolute;
    bottom: 24px;
    left: 50%; transform: translateX(-50%);
    color: var(--c-text-faint);
    font-size: 10px;
    letter-spacing: 6px;
    text-transform: uppercase;
    z-index: 1;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game-canvas"></canvas>

  <!-- 상단 HUD -->
  <div id="hud" style="display:none;">
    <div class="hud-card">
      <div class="hud-label">Score</div>
      <div id="score-display">0</div>
    </div>
    <div class="hud-card">
      <div class="hud-label">Time</div>
      <div id="timer-display">30.0</div>
    </div>
  </div>
  <div id="combo-display">COMBO ×2</div>
  <div id="toast"></div>

  <!-- 피버 오버레이 -->
  <div id="fever-overlay"></div>

  <!-- 카운트다운 (슈팅 미션용) -->
  <div id="countdown" style="display:none;">
    <div id="countdown-num"></div>
  </div>

  <!-- 슈팅 UI -->
  <div id="shooting-ui">
    <div id="shooting-hint">FAKE THE GOALIE<br>HOLD & RELEASE</div>
  </div>

  <!-- 시작 화면 -->
  <div class="screen" id="start-screen">
    <div class="brand-badge">MT 2026 · OFFICIAL ARCADE</div>

    <div class="title-wrap">
      <h1 class="title">WEST <span class="title-accent">HOCKEY</span></h1>
      <div class="title-year">2 0 2 6</div>
    </div>

    <div class="subtitle">Ice Training Challenge</div>

    <div class="ranking-box">
      <div class="ranking-title">
        <span class="ranking-title-text">Leaderboard</span>
        <span class="ranking-title-icon">🏆</span>
      </div>
      <div id="ranking-list"></div>
    </div>

    <button class="btn-primary" id="start-btn">START</button>

    <div class="guide-text">
      <b>← →</b> SWIPE TO MOVE · <b>↑</b> SWIPE TO JUMP<br>
      🟠 DODGE · 😡 JUMP OVER · 🟢 COLLECT
    </div>

    <div class="footer-mark">FROZEN STADIUM · 2026</div>
  </div>

  <!-- 결과 화면 -->
  <div class="screen hidden" id="result-screen">
    <div class="brand-badge">MISSION COMPLETE</div>
    <div class="result-label">Final Score</div>
    <div class="result-score" id="result-score">0</div>
    <div class="result-breakdown" id="result-breakdown"></div>
    <div class="name-input">
      <input type="text" id="name-input" maxlength="5" placeholder="NAME">
    </div>
    <div class="result-buttons">
      <button class="btn-secondary" id="save-btn">Save</button>
      <button class="btn-secondary" id="retry-btn">Retry</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ============================================================
// 상수 및 설정
// ============================================================
const CFG = {
  // 화면
  CANVAS_RATIO: 3/4, // 가로:세로 = 3:4 (아이패드 세로 모드 가정)

  // 캐릭터/장애물
  PLAYER_RADIUS: 40,
  OBSTACLE_RADIUS: 35,
  COLLISION_DIST: 50,
  PLAYER_Y_RATIO: 0.8, // 화면 하단 80% 위치

  // 판정
  DRAG_MIN_DIST: 82,
  DRAG_MAX_TIME: 400,
  DRAG_ANGLE_DEG: 30,

  // 게임 타이밍
  TOTAL_TIME: 33000, // 33초
  TRAINING_END: 25000, // 0~25초
  DRIBBLE_END: 30000, // 25~30초 (5초)
  FEVER_END: 33000, // 30~33초 (3초)

  // 점수 (v2)
  SCORE_CONE: 20,
  SCORE_CONE_COMBO: 50,
  SCORE_BOSS: 50,
  SCORE_BOSS_COMBO: 120,
  SCORE_ENERGY: 50,
  SCORE_SKATE: 100, // 스케이트화 습득 즉시 보너스
  SCORE_SMASH: 80, // 스케이트화 발동 중 장애물 1개당 보너스
  PENALTY_HIT: -30,
  SCORE_TAP_NORMAL: 30,
  SCORE_TAP_FEVER: 50,
  SCORE_SHOOT_MULT: 5,

};

function loadAssets() {
  for (const key of Object.keys(ASSETS)) {
    const a = ASSETS[key];
    const img = new Image();
    img.onload = () => { a.loaded = true; a.img = img; };
    img.onerror = () => { a.loaded = false; }; // 실패 시 일러스트 fallback
    img.src = a.path;
  }
}

// 이미지 그리기 헬퍼 (loaded면 이미지, 아니면 fallback 함수 호출)
function drawAssetOrFallback(key, x, y, w, h, fallbackFn) {
  const a = ASSETS[key];
  if (a && a.loaded && a.img) {
    ctx.drawImage(a.img, x - w/2, y - h/2, w, h);
  } else {
    fallbackFn();
  }
}

// 사운드 시스템 (WebAudio API 합성)
// ============================================================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { console.warn('Audio not supported'); }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, duration, type='sine', vol=0.3) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration);
}
function playNoise(duration, vol=0.2) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0; i<bufferSize; i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  src.connect(gain).connect(audioCtx.destination);
  src.start(t);
}
const SFX = {
  tap: () => playTone(600, 0.05, 'square', 0.15),
  drag: () => playNoise(0.2, 0.15),
  hit: () => { playTone(100, 0.3, 'sawtooth', 0.4); playNoise(0.3, 0.3); },
  energy: () => { playTone(800, 0.1, 'sine', 0.3); setTimeout(()=>playTone(1200, 0.15, 'sine', 0.25), 50); },
  goal: () => {
    [440, 554, 659, 880].forEach((f, i) => setTimeout(()=>playTone(f, 0.3, 'sine', 0.3), i*100));
  },
  miss: () => playTone(150, 0.2, 'triangle', 0.4),
  combo: () => { playTone(880, 0.1, 'sine', 0.3); setTimeout(()=>playTone(1320, 0.15, 'sine', 0.3), 80); },
  countdown: () => playTone(440, 0.1, 'sine', 0.3),

// ============================================================
// 입력 처리
// ============================================================
const TOUCH = { active:false, startX:0, startY:0, startTime:0, id:null };

function onTouchStart(e) {
  e.preventDefault();
  initAudio();
  if (TOUCH.active) return;
  const t = e.changedTouches ? e.changedTouches[0] : e;
  TOUCH.active = true;
  TOUCH.id = e.changedTouches ? t.identifier : 'mouse';
  TOUCH.startX = t.clientX;
  TOUCH.startY = t.clientY;
  TOUCH.startTime = performance.now();

  // 슈팅 미션 홀드 시작
  if (STATE.phase === 'shooting' && STATE.shoot.ready && !STATE.shoot.locked) {
    STATE.shoot.holdStart = performance.now();
    STATE.shoot.side = t.clientX < W/2 ? 'left' : 'right';
  }
}

function onTouchMove(e) {
  if (!TOUCH.active) return;
  // 슈팅 중 좌/우 영역 토글
  if (STATE.phase === 'shooting' && STATE.shoot.ready && !STATE.shoot.locked && STATE.shoot.holdStart > 0) {
    const t = e.changedTouches ? e.changedTouches[0] : e;
    if (e.changedTouches) {
      let found = false;
      for (let i=0; i<e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === TOUCH.id) { found = true; break; }
      }
      if (!found) return;
    }
    const newSide = t.clientX < W/2 ? 'left' : 'right';
    if (STATE.shoot.side !== newSide) {
      STATE.shoot.side = newSide;
      SFX.tap();
    }
  }
}

function onTouchEnd(e) {
  e.preventDefault();
  if (!TOUCH.active) return;
  const t = e.changedTouches ? e.changedTouches[0] : e;
  if (e.changedTouches) {
    let found = false;
    for (let i=0; i<e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === TOUCH.id) { found = true; break; }
    }
    if (!found) return;
  }
  const endX = t.clientX, endY = t.clientY;
  const dx = endX - TOUCH.startX, dy = endY - TOUCH.startY;
  const dist = Math.hypot(dx, dy);
  const dt = performance.now() - TOUCH.startTime;

  TOUCH.active = false;

  // 슈팅 미션 릴리즈
  if (STATE.phase === 'shooting' && STATE.shoot.ready && !STATE.shoot.locked) {
    if (performance.now() - STATE.shoot.holdStart > 50) {
      executeShoot();
      return;
    }
  }

  // 드리블/피버 - 탭만 받음
  if (STATE.phase === 'dribble' || STATE.phase === 'fever') {
    if (dist < CFG.DRAG_MIN_DIST) {
      handleTapDribble();
    }
    return;
  }

  // 훈련 단계 - 스와이프 4방향 판정
  if (STATE.phase === 'training') {
    if (dist >= CFG.DRAG_MIN_DIST && dt <= CFG.DRAG_MAX_TIME) {
      if (Math.abs(dx) > Math.abs(dy)) {
        // 수평 스와이프 → 좌/우 한 칸 이동
        if (dx > 0) handleSwipeRight();
        else handleSwipeLeft();
      } else {
        // 수직 스와이프 → 위 = 점프 (아래는 무시)
        if (dy < 0) handleJump();
      }
    }
    // 거리/시간 미달 시 무시
  }
}

function handleSwipeLeft() {
  if (STATE.player.lane > 1) {
    STATE.player.lane--;
    SFX.tap();
  }
}

function handleSwipeRight() {
  if (STATE.player.lane < 3) {
    STATE.player.lane++;
    SFX.tap();
  }
}

function handleJump() {
  const now = performance.now();
  if (now < STATE.player.jumpUntil) return; // 점프 중 중복 무시
  STATE.player.jumpUntil = now + CFG.JUMP_DURATION;
  SFX.drag();
}

function handleTapDribble() {
  if (STATE.phase === 'dribble') {
    STATE.score += CFG.SCORE_TAP_NORMAL;
    STATE.stats.normalTaps++;
  } else if (STATE.phase === 'fever') {
    STATE.score += CFG.SCORE_TAP_FEVER;
    STATE.stats.feverTaps++;
  }
  SFX.tap();
  updateScoreDisplay();
  // 드리블 애니메이션 트리거
  STATE.puckShake = 12;
  STATE.dribble.dir *= -1; // 방향 토글
  STATE.dribble.hitTime = performance.now();
  // 파티클 (얼음 가루)
  const puckCx = W/2 + STATE.dribble.puckX;
  const puckCy = H/2;
  for (let i=0; i<5; i++) {
    STATE.particles.push({
      x: puckCx, y: puckCy,
      vx: (Math.random()-0.5)*100, vy: (Math.random()-0.5)*100 - 30,
      life: 0.3, maxLife: 0.3,
      color: '#ffffff', size: 2 + Math.random()*2,
    });
  }
}

// ============================================================
// 메인 루프
// ============================================================
let lastTime = 0;
function loop(now) {
  const dt = Math.min(50, now - lastTime) / 1000; // 초 단위, 최대 50ms cap
  lastTime = now;

  if (STATE.phase !== 'menu' && STATE.phase !== 'result') {
    update(dt, now);
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame((t) => { lastTime = t; loop(t); });

function update(dt, now) {
  if (STATE.phase === 'shooting') {
    updateShooting(dt, now);
    return;
  }

  STATE.elapsed = now - STATE.startTime;

  // 단계 전환
  if (STATE.phase === 'training' && STATE.elapsed >= CFG.TRAINING_END) {
    enterDribble();
  } else if (STATE.phase === 'dribble' && STATE.elapsed >= CFG.DRIBBLE_END) {
    enterFever();
  } else if (STATE.phase === 'fever' && STATE.elapsed >= CFG.FEVER_END) {
    enterShooting();
    return;
  }

  // 타이머 표시
  const remainingMs = Math.max(0, CFG.TOTAL_TIME - STATE.elapsed);
  document.getElementById('timer-display').textContent = (remainingMs / 1000).toFixed(1);

  // 플레이어 위치 보간
  const targetX = (STATE.player.lane - 0.5) * laneWidth;
  STATE.player.x += (targetX - STATE.player.x) * Math.min(1, dt * 18);
  STATE.player.y = H * CFG.PLAYER_Y_RATIO;

  // 배경 스크롤 (훈련 중에만)
  if (STATE.phase === 'training') {
    const t = STATE.elapsed / CFG.TRAINING_END;
    const bgSpeed = CFG.BG_SCROLL_START + (CFG.BG_SCROLL_END - CFG.BG_SCROLL_START) * t;
    STATE.bgScrollY = (STATE.bgScrollY + bgSpeed * dt);
  }

  // 오브젝트 스폰
  if (STATE.phase === 'training') {
    while (STATE.patternQueue.length > 0 && STATE.patternQueue[0][0] * 1000 <= STATE.elapsed) {
      const [t, lane, type] = STATE.patternQueue.shift();
      spawnObstacle(lane, type);
    }
  }

  // 오브젝트 업데이트
  const tProgress = Math.min(1, STATE.elapsed / CFG.TRAINING_END);
  let fallSpeed = CFG.FALL_SPEED_START + (CFG.FALL_SPEED_END - CFG.FALL_SPEED_START) * tProgress;
  // 스케이트 부스트 시 낙하 가속
  const isSkating = now < STATE.skate.activeUntil;
  if (isSkating) fallSpeed *= CFG.SKATE_SPEED_MULT;

  for (let i = STATE.obstacles.length - 1; i >= 0; i--) {
    const obs = STATE.obstacles[i];
    const prevY = obs.y;
    obs.y += fallSpeed * dt;

    // === 콘 회피 카운트: 플레이어 라인 통과 시점 ===
    if (obs.type === 'cone' && !obs.passed && !obs.collided) {
      // 플레이어 Y를 막 통과한 프레임
      if (prevY <= STATE.player.y && obs.y > STATE.player.y) {
        obs.passed = true;
        // 다른 라인이었으면 회피 성공
        if (obs.lane !== STATE.player.lane) {
          STATE.combo++;
          if (STATE.combo >= CFG.COMBO_THRESHOLD) {
            STATE.score += CFG.SCORE_CONE_COMBO;
            STATE.stats.coneCombo++;
            if (STATE.combo === CFG.COMBO_THRESHOLD) showCombo();
          } else {
            STATE.score += CFG.SCORE_CONE;
            STATE.stats.coneNormal++;
          }
        }
      }
    }

    // === 감독 회피 카운트: Y축 통과 시점 (점프 안한 경우는 충돌 처리됨) ===
    if (obs.type === 'boss' && !obs.passed && obs.avoided) {
      if (prevY <= STATE.player.y && obs.y > STATE.player.y) {
        obs.passed = true; // 이미 avoided 시점에 점수 가산됨, 중복 방지용 마킹만
      }
    }

    // 화면 밖
    if (obs.y > H + 50) {
      STATE.obstacles.splice(i, 1);
      continue;
    }

    // 충돌 판정
    if (now > STATE.player.invincibleUntil && !obs.collided) {
      // 이미 통과(passed) 또는 회피(avoided)된 오브젝트는 충돌 면제
      if (obs.passed || obs.avoided) continue;

      const isSkateActive = now < STATE.skate.activeUntil;

      // 스케이트 발동 중: 라인 무관 + 확장 박스로 모든 장애물 파괴
      if (isSkateActive && (obs.type === 'cone' || obs.type === 'boss')) {
        const dist = Math.abs(obs.y - STATE.player.y);
        // 콘은 라인 일치만, 감독은 라인 무관 (원래 가로 장벽)
        const inRange = (obs.type === 'boss') || (Math.abs(obs.lane - STATE.player.lane) <= 1);
        if (inRange && dist < 90) {
          handleCollision(obs);
          continue;
        }
      }

      // 감독은 lane 무시 (가로 장벽), 콘/캔/스케이트는 같은 lane만 체크
      const laneMatch = (obs.type === 'boss') || (obs.lane === STATE.player.lane);
      if (laneMatch) {
        const dist = Math.abs(obs.y - STATE.player.y);
        if (dist < CFG.COLLISION_DIST) {
          const isJumping = now < STATE.player.jumpUntil;
          // 점프 중 감독: 자동 회피 + 콤보/점수
          if (isJumping && obs.type === 'boss' && !obs.avoided) {
            obs.avoided = true;
            STATE.combo++;
            if (STATE.combo >= CFG.COMBO_THRESHOLD) {
              STATE.score += CFG.SCORE_BOSS_COMBO;
              STATE.stats.bossCombo++;
              if (STATE.combo === CFG.COMBO_THRESHOLD) showCombo();
            } else {
              STATE.score += CFG.SCORE_BOSS;
              STATE.stats.bossNormal++;
            }
            SFX.drag();
            updateScoreDisplay();
            continue;
          }
          // 점프 중 캔/스케이트: 미습득
          if (isJumping && (obs.type === 'energy' || obs.type === 'skate')) {
            continue;
          }
          handleCollision(obs);
        }
      }
    }
  }

  // 점수 표시
  updateScoreDisplay();

  // 파티클 업데이트
  for (let i = STATE.particles.length - 1; i >= 0; i--) {
    const p = STATE.particles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 200 * dt;
    if (p.life <= 0) STATE.particles.splice(i, 1);
  }

  // 무적 알파 깜빡임
  if (now < STATE.player.invincibleUntil) {
    STATE.player.alpha = 0.4 + 0.5 * Math.sin(now * 0.04);
  } else {
    STATE.player.alpha = 1;
  }
}

function spawnObstacle(lane, type) {
  STATE.obstacles.push({
    id: STATE.obstacleIdCounter++,
    type, lane,
    y: -50,
    avoided: false,
    collided: false,
    passed: false,
  });
}

function handleCollision(obs) {
  const now = performance.now();
  const isSkating = now < STATE.skate.activeUntil;

  // === 스케이트화 자체 습득 ===
  if (obs.type === 'skate') {
    STATE.score += CFG.SCORE_SKATE;
    STATE.stats.skate++;
    obs.collided = true;
    obs.y = H + 100;
    // 부스트 발동
    STATE.skate.activeUntil = now + CFG.SKATE_DURATION_MS;
    SFX.energy();
    // 황금색 + 흰색 파티클 폭발
    spawnParticles(STATE.player.x, STATE.player.y, '#ffd700', 30);
    spawnParticles(STATE.player.x, STATE.player.y, '#ffffff', 18);
    spawnParticles(STATE.player.x, STATE.player.y, '#00d4ff', 12);
    STATE.energyFlash = 1.5;
    STATE.skateFlash = 1.0;
    showToast('SUPER SPEED! +' + CFG.SCORE_SKATE, '#ffd700');
    updateScoreDisplay();
    return;
  }

  // === 음료캔 습득 (화려한 이펙트 강화) ===
  if (obs.type === 'energy') {
    STATE.score += CFG.SCORE_ENERGY;
    STATE.stats.energy++;
    obs.collided = true;
    obs.y = H + 100;
    SFX.energy();
    // 다층 파티클 폭발 (3배 더 화려)
    spawnParticles(STATE.player.x, STATE.player.y, '#00ff88', 40);
    spawnParticles(STATE.player.x, STATE.player.y, '#ffffff', 20);
    spawnParticles(STATE.player.x, STATE.player.y, '#ffcc00', 14);
    STATE.energyFlash = 1.5; // 더 강한 플래시
    // 다층 토스트
    showToast('⚡ ENERGY +' + CFG.SCORE_ENERGY, '#00ff88');
    // 화면 펄스 효과 (테두리 글로우)
    STATE.energyRingPulse = 1.0;
    updateScoreDisplay();
    return;
  }

  if (obs.type === 'boss' && obs.avoided) return;

  // === 스케이트 발동 중 장애물 충돌 = 파괴 ===
  if (isSkating && (obs.type === 'cone' || obs.type === 'boss')) {
    obs.collided = true;
    STATE.score += CFG.SCORE_SMASH;
    STATE.stats.smash++;
    STATE.skate.smashCount++;
    obs.y = H + 100;
    SFX.hit();
    // 파괴 파티클 (콘은 주황, 감독은 갈색)
    const color = obs.type === 'cone' ? '#ff7a1f' : '#d4a574';
    spawnParticles(STATE.player.x, STATE.player.y, color, 20);
    spawnParticles(STATE.player.x, STATE.player.y, '#ffd700', 10);
    // 스매시 카운트마다 점수 토스트
    if (STATE.skate.smashCount % 3 === 0) {
      showToast('SMASH! +' + (CFG.SCORE_SMASH * 3), '#ffd700');
    }
    updateScoreDisplay();
    return;
  }

  // === 일반 충돌 ===
  obs.collided = true;
  STATE.score += CFG.PENALTY_HIT;
  STATE.combo = 0;
  STATE.stats.hits++;
  STATE.player.invincibleUntil = now + CFG.INVINCIBLE_MS;
  obs.y = H + 100;
  SFX.hit();
  shakeScreen();
  spawnParticles(STATE.player.x, STATE.player.y, '#ff3355', 16);
  updateScoreDisplay();
}

function spawnParticles(x, y, color, count) {
  for (let i=0; i<count; i++) {
    const angle = (Math.PI * 2 * i / count) + Math.random() * 0.5;
    const speed = 100 + Math.random() * 150;
    STATE.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 50,
      life: 0.5 + Math.random() * 0.3,
      maxLife: 0.8,
      color,
      size: 3 + Math.random() * 4,
    });
  }
}

function shakeScreen() {
  const app = document.getElementById('app');
  app.classList.remove('shake');
  void app.offsetWidth;
  app.classList.add('shake');
}

function showCombo() {
  const el = document.getElementById('combo-display');
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  SFX.combo();
}

function showToast(text, color) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.style.color = color || '#fff';
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function updateScoreDisplay() {
  const el = document.getElementById('score-display');
  el.textContent = STATE.score;
  if (STATE.score < 0) el.classList.add('negative');
  else el.classList.remove('negative');
}

// ============================================================
// 단계 전환
// ============================================================
function enterDribble() {
  STATE.phase = 'dribble';
  STATE.obstacles = []; // 잔여 장애물 청소
  showToast('GO! GO!', '#ffd700');
  SFX.go();
}

function enterFever() {
  STATE.phase = 'fever';
  document.getElementById('fever-overlay').classList.add('active');
  showToast('FEVER TIME', '#ff3355');
  SFX.go();
}

function enterShooting() {
  STATE.phase = 'shooting';
  STATE.elapsed = CFG.FEVER_END;
  document.getElementById('fever-overlay').classList.remove('active');
  document.getElementById('hud').style.display = 'none';
  document.getElementById('shooting-ui').classList.add('active');

  STATE.shootRound = 1;
  STATE.shootRoundScores = []; // 각 라운드 점수 기록
  initShootRound();
}

function initShootRound() {
  STATE.shoot = {
    active: true,
    value: 0,
    dir: 1,
    startTime: performance.now(),
    holdStart: 0,
    locked: false,
    result: null,
    ready: false,
    countdown: 3,
    countdownStart: performance.now(),
    animStart: 0,
    animPhase: null,
    side: 'left',
    goalieT: Math.random(), // 라운드마다 골리 시작 위치 랜덤
  };
  showCountdown(3);
}

function showCountdown(n) {
  const el = document.getElementById('countdown');
  const num = document.getElementById('countdown-num');
  el.style.display = 'flex';
  num.textContent = n;
  num.classList.remove('show');
  void num.offsetWidth;
  num.classList.add('show');
  SFX.countdown();
}

function updateShooting(dt, now) {
  const sh = STATE.shoot;
  if (sh.animPhase === 'done') return;

  // 골리 위치 업데이트 (locked 전까지 항상 진행, 락 후엔 정지)
  if (!sh.locked) {
    sh.goalieT = (sh.goalieT + dt / (CFG.GOALIE_PERIOD_MS / 1000)) % 1;
  }

  // 카운트다운
  if (!sh.ready) {
    const elapsed = now - sh.countdownStart;
    const newCount = 3 - Math.floor(elapsed / 1000);
    if (newCount < sh.countdown && newCount > 0) {
      sh.countdown = newCount;
      showCountdown(newCount);
    } else if (newCount <= 0 && sh.countdown > 0) {
      sh.countdown = 0;
      document.getElementById('countdown').style.display = 'none';
      document.getElementById('shooting-hint').textContent = '';
      sh.ready = true;
      sh.startTime = now;
      SFX.go();
    }
    return;
  }

  // 게이지 움직임
  if (!sh.locked) {
    if (sh.holdStart > 0 && now - sh.holdStart > CFG.SHOOT_HOLD_DELAY) {
      let speed = 100 / (CFG.SHOOT_PERIOD_MS / 2 / 1000); // 더 빠른 왕복
      if (sh.value > CFG.SHOOT_JACKPOT_ZONE) speed *= CFG.SHOOT_JACKPOT_MULT;
      sh.value += sh.dir * speed * dt;
      if (sh.value >= 100) { sh.value = 100; sh.dir = -1; }
      else if (sh.value <= 0) { sh.value = 0; sh.dir = 1; }
    }
  } else {
    // 결과 애니메이션
    if (sh.animPhase === 'puckFly') {
      const t = (now - sh.animStart) / 700;
      if (t >= 1) {
        if (sh.result.goal) {
          sh.animPhase = 'goal';
          sh.animStart = now;
          STATE.score += sh.result.bonus;
          STATE.stats.shootScore = sh.result.bonus;
          updateScoreDisplay();
          SFX.goal();
          showToast('⚡ GOAL! +' + sh.result.bonus, '#ffd700');
        } else {
          sh.animPhase = 'miss';
          sh.animStart = now;
          SFX.miss();
          shakeScreen();
          const msg = sh.result.reason === 'weak' ? 'WEAK SHOT' : 'SAVED';
          showToast(msg, '#ff3355');
        }
      }
    } else if (sh.animPhase === 'goal' || sh.animPhase === 'miss') {
      const t = (now - sh.animStart) / (sh.animPhase === 'goal' ? 2000 : 1500);
      if (t >= 1) {
        sh.animPhase = 'done';
        // 현재 라운드 점수 기록
        STATE.shootRoundScores.push(sh.result.bonus);
        STATE.stats.shootScore = STATE.shootRoundScores.reduce((a,b) => a+b, 0);

        if (STATE.shootRound < CFG.SHOOT_ROUNDS) {
          // 다음 라운드
          STATE.shootRound++;
          setTimeout(() => initShootRound(), 700);
        } else {
          // 최종 종료
          setTimeout(() => endGame(), 600);
        }
      }
    }
  }
}

function executeShoot() {
  const sh = STATE.shoot;
  if (sh.locked) return;
  if (!sh.ready) return;

  // 홀드 시간이 100ms 미만이면 의도되지 않은 떼기로 보고 무시 (재시도 허용)
  if (sh.holdStart === 0 || performance.now() - sh.holdStart < CFG.SHOOT_HOLD_DELAY) {
    sh.holdStart = 0; // 리셋, 다시 누를 수 있게
    return;
  }

  sh.locked = true;
  const v = Math.round(sh.value);

  // 골리 위치 (-1.0 ~ +1.0 정규화, 음수=왼쪽, 양수=오른쪽)
  const goalieNorm = Math.sin(sh.goalieT * Math.PI * 2) * CFG.GOALIE_RANGE_RATIO;

  let goal = false;
  let bonus = 0;
  let reason = '';

  if (v < CFG.SHOOT_GAUGE_MIN) {
    // 게이지 부족 - 약한 슛, 무조건 세이브
    goal = false;
    reason = 'weak'; // 약한 슛
  } else {
    // 슈팅 방향과 골리 위치 비교
    const tolerance = CFG.GOALIE_CENTER_TOLERANCE;
    const isGoalieLeft = goalieNorm < -tolerance;
    const isGoalieRight = goalieNorm > tolerance;
    const isGoalieCenter = !isGoalieLeft && !isGoalieRight;

    if (isGoalieCenter) {
      // 중앙 - 50% 확률
      goal = Math.random() < 0.5;
      reason = goal ? 'lucky' : 'center_save';
    } else if ((sh.side === 'left' && isGoalieRight) || (sh.side === 'right' && isGoalieLeft)) {
      // 반대 방향 - 골인 확정
      goal = true;
      reason = 'wrong_side';
    } else {
      // 같은 방향 - 세이브 확정
      goal = false;
      reason = 'same_side';
    }

    if (goal) bonus = v * CFG.SCORE_SHOOT_MULT;
  }

  sh.result = { value: v, goal, bonus, side: sh.side, goalieNorm, reason };
  sh.animPhase = 'puckFly';
  sh.animStart = performance.now();
  document.getElementById('shooting-hint').textContent = '';
}

// ============================================================
// 렌더링
// ============================================================
function render() {
  ctx.clearRect(0, 0, W, H);

  if (STATE.phase === 'menu' || STATE.phase === 'result') {
    return;
  }

  if (STATE.phase === 'shooting') {
    renderShooting();
    return;
  }

  // === 빙판 배경 (실사 아이스링크) ===
  // 기본 빙판 그라데이션
  const iceGrad = ctx.createLinearGradient(0, 0, 0, H);
  iceGrad.addColorStop(0, '#f7fbff');
  iceGrad.addColorStop(0.5, '#e3eef9');
  iceGrad.addColorStop(1, '#cadcef');
  ctx.fillStyle = iceGrad;
  ctx.fillRect(0, 0, W, H);

  const scrollOffset = STATE.bgScrollY;

  // === 페인트 라인 시스템 (실제 NHL 링크) ===
  // 라인이 위에서 아래로 스크롤되며 반복
  if (!STATE.rinkLines) {
    // 라인 시퀀스 정의: 무한 반복용 패턴 (단위: 화면 높이의 비율)
    STATE.rinkLines = [
      { offset: 0,    type: 'goal',   color: '#cc1f3a' },   // 골 라인 (빨강)
      { offset: 280,  type: 'crease', color: '#4d9fff' },   // 골 크리스 (파란 반원 영역)
      { offset: 560,  type: 'faceoff', color: '#cc1f3a' },  // 페이스오프 서클
      { offset: 900,  type: 'blue',   color: '#2563cc' },   // 블루 라인 (두꺼운 파랑)
      { offset: 1300, type: 'center', color: '#cc1f3a' },   // 센터 라인 (빨강 점선)
      { offset: 1700, type: 'blue',   color: '#2563cc' },   // 두 번째 블루 라인
      { offset: 2100, type: 'faceoff', color: '#cc1f3a' },  // 페이스오프
      { offset: 2400, type: 'crease', color: '#4d9fff' },   // 골 크리스
      { offset: 2680, type: 'goal',   color: '#cc1f3a' },   // 다음 골 라인
    ];
    STATE.rinkCycle = 2700; // 한 사이클 길이
  }

  // 각 라인을 스크롤 적용하여 그리기
  const cycle = STATE.rinkCycle;
  const baseOffset = scrollOffset % cycle;

  for (let cycleI = -1; cycleI <= 1; cycleI++) {
    for (const line of STATE.rinkLines) {
      const yPos = (line.offset + cycleI * cycle - baseOffset);
      if (yPos < -200 || yPos > H + 200) continue;
      drawRinkLine(yPos, line);
    }
  }

  // === 빙판 표면 디테일 (스크래치 + 반짝임) ===
  if (!STATE.iceScratches) {
    STATE.iceScratches = [];
    for (let i = 0; i < 60; i++) {
      STATE.iceScratches.push({
        x: Math.random(),
        baseY: Math.random() * 1000,
        len: 20 + Math.random() * 70,
        angle: (Math.random() - 0.5) * 0.4,
        alpha: 0.08 + Math.random() * 0.18,
      });
    }
  }
  for (const sc of STATE.iceScratches) {
    const x = sc.x * W;
    const y = ((sc.baseY + scrollOffset * 0.5) % (H + 200)) - 100;
    ctx.strokeStyle = `rgba(140, 180, 220, ${sc.alpha})`;
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(sc.angle) * sc.len, y + Math.sin(sc.angle) * sc.len);
    ctx.stroke();
  }

  if (!STATE.iceSparkles) {
    STATE.iceSparkles = [];
    for (let i = 0; i < 40; i++) {
      STATE.iceSparkles.push({
        x: Math.random(),
        baseY: Math.random() * 800,
        size: 0.8 + Math.random() * 1.5,
        twinkle: Math.random() * Math.PI * 2,
      });
    }
  }
  const _now = performance.now();
  for (const sp of STATE.iceSparkles) {
    const x = sp.x * W;
    const y = ((sp.baseY + scrollOffset * 0.7) % (H + 200)) - 100;
    const tw = (Math.sin(_now * 0.003 + sp.twinkle) + 1) / 2;
    ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + tw * 0.5})`;
    ctx.beginPath();
    ctx.arc(x, y, sp.size, 0, Math.PI*2);
    ctx.fill();
  }

  // 빙판 가장자리 비네팅
  const vGrad = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.8);
  vGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vGrad.addColorStop(1, 'rgba(20, 40, 80, 0.3)');
  ctx.fillStyle = vGrad;
  ctx.fillRect(0, 0, W, H);

  // 피버 시 빙판 붉은 톤 오버레이
  if (STATE.phase === 'fever') {
    ctx.fillStyle = 'rgba(255, 60, 100, 0.18)';
    ctx.fillRect(0, 0, W, H);
  }

  // 드리블/피버 - 닌텐도 아케이드 풍
  if (STATE.phase === 'dribble' || STATE.phase === 'fever') {
    const now = performance.now();
    const isFever = STATE.phase === 'fever';

    // === 빙판 배경 ===
    const iceGrad = ctx.createLinearGradient(0, 0, 0, H);
    iceGrad.addColorStop(0, '#f7fbff');
    iceGrad.addColorStop(0.5, '#e3eef9');
    iceGrad.addColorStop(1, '#cadcef');
    ctx.fillStyle = iceGrad;
    ctx.fillRect(0, 0, W, H);

    // 빙판 반짝임 (정지된 채로)
    if (!STATE.dribbleSparkles) {
      STATE.dribbleSparkles = [];
      for (let i=0; i<30; i++) {
        STATE.dribbleSparkles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          size: 1 + Math.random() * 2,
          phase: Math.random() * Math.PI * 2,
        });
      }
    }
    for (const sp of STATE.dribbleSparkles) {
      const tw = (Math.sin(now * 0.003 + sp.phase) + 1) / 2;
      ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + tw * 0.5})`;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI*2);
      ctx.fill();
    }

    // === 페이스오프 서클 (드리블 영역 표시) ===
    const dribbleY = H * 0.62;
    const circleR = 130;
    // 푸른 페인트 채움 (서클 안)
    ctx.fillStyle = isFever ? 'rgba(255, 70, 100, 0.18)' : 'rgba(77, 159, 255, 0.18)';
    ctx.beginPath();
    ctx.arc(W/2, dribbleY, circleR, 0, Math.PI*2);
    ctx.fill();
    // 빨강 외곽선 (두꺼움)
    ctx.strokeStyle = '#cc1f3a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(W/2, dribbleY, circleR, 0, Math.PI*2);
    ctx.stroke();
    // 작은 중앙 점
    ctx.fillStyle = '#cc1f3a';
    ctx.beginPath();
    ctx.arc(W/2, dribbleY, 8, 0, Math.PI*2);
    ctx.fill();

    // 페이스오프 T 마크 4방향
    ctx.strokeStyle = '#cc1f3a';
    ctx.lineWidth = 3.5;
    const offsetsDir = [
      { dx: 0, dy: -circleR - 30 },
      { dx: 0, dy: circleR + 30 },
      { dx: -circleR - 30, dy: 0 },
      { dx: circleR + 30, dy: 0 },
    ];
    for (const o of offsetsDir) {
      const cx = W/2 + o.dx;
      const cy = dribbleY + o.dy;
      ctx.beginPath();
      if (o.dy !== 0) {
        ctx.moveTo(cx - 16, cy);
        ctx.lineTo(cx - 16, cy + (o.dy > 0 ? -14 : 14));
        ctx.lineTo(cx + 16, cy + (o.dy > 0 ? -14 : 14));
        ctx.lineTo(cx + 16, cy);
      } else {
        ctx.moveTo(cx, cy - 16);
        ctx.lineTo(cx + (o.dx > 0 ? -14 : 14), cy - 16);
        ctx.lineTo(cx + (o.dx > 0 ? -14 : 14), cy + 16);
        ctx.lineTo(cx, cy + 16);
      }
      ctx.stroke();
    }

    // 피버 시 배경 붉은 톤
    if (isFever) {
      ctx.fillStyle = 'rgba(255, 60, 100, 0.18)';
      ctx.fillRect(0, 0, W, H);

      // 사이렌 라이트 (양옆에서 깜빡)
      const sirenPulse = (Math.sin(now * 0.02) + 1) / 2;
      const sirenGrad1 = ctx.createRadialGradient(50, H/2, 50, 50, H/2, 250);
      sirenGrad1.addColorStop(0, `rgba(255, 50, 100, ${sirenPulse * 0.6})`);
      sirenGrad1.addColorStop(1, 'rgba(255, 50, 100, 0)');
      ctx.fillStyle = sirenGrad1;
      ctx.fillRect(0, 0, 300, H);

      const sirenGrad2 = ctx.createRadialGradient(W-50, H/2, 50, W-50, H/2, 250);
      sirenGrad2.addColorStop(0, `rgba(255, 200, 50, ${(1-sirenPulse) * 0.6})`);
      sirenGrad2.addColorStop(1, 'rgba(255, 200, 50, 0)');
      ctx.fillStyle = sirenGrad2;
      ctx.fillRect(W-300, 0, 300, H);
    }

    // === 퍽 위치 계산 ===
    const targetPuckX = STATE.dribble.dir * 90;
    STATE.dribble.puckX += (targetPuckX - STATE.dribble.puckX) * 0.45;
    const puckX = W/2 + STATE.dribble.puckX;
    const puckY = dribbleY;

    // 퍽 움직임 트레일 (이전 위치 잔상)
    const trailColor = isFever ? 'rgba(255, 100, 100,' : 'rgba(80, 140, 220,';
    for (let i=1; i<=4; i++) {
      const trailX = W/2 + STATE.dribble.puckX - STATE.dribble.dir * i * 15;
      const alpha = (1 - i/5) * 0.35;
      ctx.fillStyle = trailColor + ` ${alpha})`;
      ctx.beginPath();
      ctx.ellipse(trailX, puckY, 30 - i*3, 8 - i, 0, 0, Math.PI*2);
      ctx.fill();
    }

    // 퍽 임팩트 시점 효과 (별 폭발)
    const timeSinceHit = now - STATE.dribble.hitTime;
    if (timeSinceHit < 200) {
      const impactT = timeSinceHit / 200;
      const impactR = 30 + impactT * 60;
      const impactAlpha = (1 - impactT) * 0.9;
      // 임팩트 별
      ctx.save();
      ctx.translate(puckX, puckY);
      ctx.rotate(timeSinceHit * 0.01);
      ctx.fillStyle = isFever ? `rgba(255, 220, 50, ${impactAlpha})` : `rgba(255, 220, 100, ${impactAlpha})`;
      ctx.strokeStyle = '#0a1228';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i=0; i<8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const r = i % 2 === 0 ? impactR : impactR * 0.5;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // === 퍽 그림자 ===
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(puckX + 5, puckY + 14, 36, 10, 0, 0, Math.PI*2);
    ctx.fill();

    // === 퍽 본체 (두꺼운 외곽선, 닌텐도 스타일) ===
    const shake = STATE.puckShake || 0;
    if (STATE.puckShake) STATE.puckShake = Math.max(0, STATE.puckShake - 0.7);
    const px = puckX + (Math.random()-0.5)*shake*0.3;
    const py = puckY + (Math.random()-0.5)*shake*0.3;

    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.ellipse(px, py, 38, 12, 0, 0, Math.PI*2);
    ctx.fill();
    // 두꺼운 외곽선
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.stroke();
    // 상단 면 (더 어두운 회색, 닌텐도 평면 셰이딩)
    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath();
    ctx.ellipse(px, py - 2, 38, 6, 0, 0, Math.PI*2);
    ctx.fill();
    // 하이라이트
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.ellipse(px - 8, py - 4, 14, 2, 0, 0, Math.PI*2);
    ctx.fill();

    // === 플레이어 캐릭터 ===
    // 임시로 STATE.player.x/y를 설정하여 drawPlayer 재사용
    const savedX = STATE.player.x;
    const savedY = STATE.player.y;
    STATE.player.x = W/2;
    STATE.player.y = dribbleY - 110;
    // 스틱 각도를 STATE.dribble에 따라 미세 흔들기 - drawPlayer 내부에서 처리 안되므로 별도 그리기
    drawPlayerDribble(W/2, dribbleY - 110, STATE.dribble.dir, timeSinceHit);
    STATE.player.x = savedX;
    STATE.player.y = savedY;

    // === 상단 타이틀 (두꺼운 외곽선 닌텐도식) ===
    drawComicText(W/2, 90, isFever ? 'FEVER!' : 'DRIBBLE!',
      isFever ? 64 : 56,
      isFever ? '#ff3355' : '#4d9fff',
      '#0a1228', 4);

    // 점수 가이드 (작게)
    ctx.fillStyle = isFever ? '#cc1f3a' : '#1e5fd4';
    ctx.font = '900 18px "Noto Sans KR", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(isFever ? '+50 / TAP' : '+30 / TAP', W/2, 130);
    ctx.textAlign = 'start';

    // 파티클
    renderParticles();
    return;
  }

  // === 오브젝트 ===
  for (const obs of STATE.obstacles) {
    const x = (obs.lane - 0.5) * laneWidth;
    drawObstacle(obs, x);
  }

  // === 플레이어 ===
  drawPlayer();

  // === 파티클 ===
  renderParticles();

  // === 음료캔 습득 플래시 === 
  if (STATE.energyFlash && STATE.energyFlash > 0) {
    STATE.energyFlash *= 0.92;
    ctx.save();
    const flashGrad = ctx.createRadialGradient(STATE.player.x, STATE.player.y, 0, STATE.player.x, STATE.player.y, 500);
    flashGrad.addColorStop(0, `rgba(0, 255, 136, ${STATE.energyFlash * 0.6})`);
    flashGrad.addColorStop(0.5, `rgba(0, 255, 136, ${STATE.energyFlash * 0.25})`);
    flashGrad.addColorStop(1, 'rgba(0, 255, 136, 0)');
    ctx.fillStyle = flashGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    if (STATE.energyFlash < 0.05) STATE.energyFlash = 0;
  }

  // === 음료캔 화면 테두리 펄스 ===
  if (STATE.energyRingPulse && STATE.energyRingPulse > 0) {
    STATE.energyRingPulse *= 0.93;
    ctx.save();
    ctx.lineWidth = 12 * STATE.energyRingPulse;
    ctx.strokeStyle = `rgba(0, 255, 136, ${STATE.energyRingPulse * 0.8})`;
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 30;
    ctx.strokeRect(6, 6, W - 12, H - 12);
    ctx.restore();
    if (STATE.energyRingPulse < 0.05) STATE.energyRingPulse = 0;
  }

  // === 스케이트 발동 중 화면 황금 오버레이 ===
  const now2 = performance.now();
  if (now2 < STATE.skate.activeUntil) {
    const remaining = (STATE.skate.activeUntil - now2) / CFG.SKATE_DURATION_MS;
    // 가장자리 황금 펄스
    ctx.save();
    const edgeGrad = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.9);
    edgeGrad.addColorStop(0, 'rgba(255, 215, 0, 0)');
    edgeGrad.addColorStop(0.7, `rgba(255, 100, 30, ${remaining * 0.25})`);
    edgeGrad.addColorStop(1, `rgba(255, 215, 0, ${remaining * 0.4})`);
    ctx.fillStyle = edgeGrad;
    ctx.fillRect(0, 0, W, H);

    // 화면 가장자리 빛 테두리
    const pulse = (Math.sin(now2 * 0.02) + 1) / 2;
    ctx.lineWidth = 8 + pulse * 4;
    ctx.strokeStyle = `rgba(255, 215, 0, ${remaining * 0.9})`;
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 30;
    ctx.strokeRect(8, 8, W - 16, H - 16);

    // 카운트다운 상단 표시
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255, 215, 0, ${remaining})`;
    ctx.font = '900 28px "Noto Sans KR", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚡ SUPER MODE ⚡', W/2, H - 30);
    ctx.font = '900 14px "Noto Sans KR", sans-serif';
    ctx.fillText(((STATE.skate.activeUntil - now2) / 1000).toFixed(1) + 's', W/2, H - 12);
    ctx.textAlign = 'start';
    ctx.restore();
  }

  // === 스케이트 습득 임팩트 (한 순간 강한 플래시) ===
  if (STATE.skateFlash && STATE.skateFlash > 0) {
    STATE.skateFlash *= 0.88;
    ctx.save();
    ctx.fillStyle = `rgba(255, 215, 0, ${STATE.skateFlash * 0.4})`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    if (STATE.skateFlash < 0.05) STATE.skateFlash = 0;
  }
}

function drawPlayer() {
  const p = STATE.player;
  const now = performance.now();
  const isSkating = now < STATE.skate.activeUntil;
  let yOffset = 0;
  let scale = 1;
  // 점프 포물선
  if (now < p.jumpUntil) {
    const t = 1 - (p.jumpUntil - now) / CFG.JUMP_DURATION;
    yOffset = -Math.sin(t * Math.PI) * CFG.JUMP_HEIGHT;
    scale = 1 + Math.sin(t * Math.PI) * 0.12;
  }
  const x = p.x, y = p.y + yOffset;

  // 점프 중 지면 그림자 (실제 위치)
  if (now < p.jumpUntil) {
    const t = 1 - (p.jumpUntil - now) / CFG.JUMP_DURATION;
    const shadowAlpha = 0.3 * (1 - Math.sin(t * Math.PI) * 0.7);
    const shadowScale = 1 - Math.sin(t * Math.PI) * 0.4;
    ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 44, 38 * shadowScale, 9 * shadowScale, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // === 스케이트 부스트 오라 (캐릭터 배경) ===
  if (isSkating) {
    const remaining = (STATE.skate.activeUntil - now) / CFG.SKATE_DURATION_MS;
    const auraR = 70 + Math.sin(now * 0.015) * 8;
    const auraGrad = ctx.createRadialGradient(x, y, 10, x, y, auraR);
    auraGrad.addColorStop(0, `rgba(255, 215, 0, ${0.6 * remaining})`);
    auraGrad.addColorStop(0.5, `rgba(255, 100, 30, ${0.3 * remaining})`);
    auraGrad.addColorStop(1, 'rgba(255, 215, 0, 0)');
    ctx.fillStyle = auraGrad;
    ctx.beginPath();
    ctx.arc(x, y, auraR, 0, Math.PI*2);
    ctx.fill();

    // 스피드 라인 (뒤로 길게)
    ctx.strokeStyle = `rgba(255, 220, 100, ${remaining * 0.6})`;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let i=0; i<5; i++) {
      const lineY = y - 50 + i * 20 + (now * 0.5) % 20;
      ctx.beginPath();
      ctx.moveTo(x - 50, lineY);
      ctx.lineTo(x - 20, lineY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 20, lineY);
      ctx.lineTo(x + 50, lineY);
      ctx.stroke();
    }
  }

  ctx.save();
  ctx.globalAlpha = p.alpha;
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  // === 그림자 (지면 상태) ===
  if (now >= p.jumpUntil) {
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(2, 44, 38, 9, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // === 살짝 흔들리는 호흡감 ===
  const breath = Math.sin(now * 0.005) * 1.2;
  const bodyY = breath;

  // === 스틱 (몸 옆에서 비스듬히) ===
  ctx.save();
  ctx.translate(28, 22 + bodyY);
  ctx.rotate(0.35);
  // 스틱 손잡이
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -28);
  ctx.lineTo(0, 18);
  ctx.stroke();
  // 손잡이 본체 (내부)
  ctx.strokeStyle = '#d4763a';
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(0, -28);
  ctx.lineTo(0, 18);
  ctx.stroke();
  // 그립 테이프 (검정 핸들)
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-3, -28, 6, 14);
  // 블레이드
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 11;
  ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.moveTo(0, 18);
  ctx.lineTo(18, 26);
  ctx.stroke();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(2, 18);
  ctx.lineTo(16, 25);
  ctx.stroke();
  ctx.restore();

  // === 몸통 (유니폼 상체) ===
  // 두꺼운 외곽선 먼저 그리는 방식
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 3;

  // 몸통 (둥근 사다리꼴)
  ctx.fillStyle = '#1e5fd4';
  ctx.beginPath();
  ctx.moveTo(-22, 14 + bodyY);
  ctx.quadraticCurveTo(-26, 30 + bodyY, -22, 42 + bodyY);
  ctx.lineTo(22, 42 + bodyY);
  ctx.quadraticCurveTo(26, 30 + bodyY, 22, 14 + bodyY);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 유니폼 가슴 라벨 (흰 가로 띠)
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(-20, 22 + bodyY);
  ctx.lineTo(20, 22 + bodyY);
  ctx.lineTo(20, 30 + bodyY);
  ctx.lineTo(-20, 30 + bodyY);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 가슴 텍스트
  ctx.fillStyle = '#1e5fd4';
  ctx.font = '900 8px "Noto Sans KR", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('WEST', 0, 28.5 + bodyY);

  // 어깨 패드 (둥근 양 어깨)
  ctx.fillStyle = '#1e5fd4';
  ctx.beginPath();
  ctx.arc(-22, 15 + bodyY, 9, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(22, 15 + bodyY, 9, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  // === 헬멧 (얼굴) ===
  const helmetY = -8 + bodyY;
  // 헬멧 본체 (둥근 도형)
  ctx.fillStyle = '#1e5fd4';
  ctx.beginPath();
  ctx.arc(0, helmetY, 26, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  // 헬멧 상단 하이라이트 (광택 = 평면 셰이딩 닌텐도 스타일)
  ctx.fillStyle = '#4d9fff';
  ctx.beginPath();
  ctx.ellipse(-8, helmetY - 10, 11, 6, -0.4, 0, Math.PI*2);
  ctx.fill();

  // 헬멧 옆 디테일 라인
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-24, helmetY - 4);
  ctx.quadraticCurveTo(0, helmetY - 8, 24, helmetY - 4);
  ctx.stroke();

  // 얼굴 영역 (살색 노출)
  ctx.fillStyle = '#fdd9a8';
  ctx.beginPath();
  ctx.ellipse(0, helmetY + 5, 14, 11, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 페이스 케이지 (그릴)
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1.5;
  // 가로 바
  for (let i=0; i<3; i++) {
    ctx.beginPath();
    ctx.moveTo(-13, helmetY + i*5);
    ctx.lineTo(13, helmetY + i*5);
    ctx.stroke();
  }
  // 세로 바 2개
  ctx.beginPath();
  ctx.moveTo(-5, helmetY - 3);
  ctx.lineTo(-5, helmetY + 13);
  ctx.moveTo(5, helmetY - 3);
  ctx.lineTo(5, helmetY + 13);
  ctx.stroke();

  // === 얼굴 (눈) - 케이지 사이로 보이는 큰 눈 ===
  // 흰자
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-7, helmetY + 2, 3, 0, Math.PI*2);
  ctx.arc(7, helmetY + 2, 3, 0, Math.PI*2);
  ctx.fill();
  // 동공 (큰 검정 점, 닌텐도식)
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(-6, helmetY + 2.5, 2, 0, Math.PI*2);
  ctx.arc(8, helmetY + 2.5, 2, 0, Math.PI*2);
  ctx.fill();
  // 눈 하이라이트 (반짝)
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-5, helmetY + 1.5, 0.8, 0, Math.PI*2);
  ctx.arc(9, helmetY + 1.5, 0.8, 0, Math.PI*2);
  ctx.fill();

  // 작은 미소 (입)
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, helmetY + 8, 3.5, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // 헬멧 상단 로고 영역 (작은 마크)
  ctx.fillStyle = '#fff';
  ctx.font = '900 7px "Noto Sans KR", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('W', 0, helmetY - 11);

  // 헬멧 끈 (양 옆 짧은 끈)
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-14, helmetY + 12);
  ctx.quadraticCurveTo(-18, helmetY + 18, -15, helmetY + 22);
  ctx.moveTo(14, helmetY + 12);
  ctx.quadraticCurveTo(18, helmetY + 18, 15, helmetY + 22);
  ctx.stroke();

  ctx.textAlign = 'start';
  ctx.restore();
}

function drawObstacle(obs, x) {
  if (obs.type === 'cone') {
    drawCone(x, obs.y);
  } else if (obs.type === 'boss') {
    drawBoss(x, obs.y, obs.avoided);
  } else if (obs.type === 'energy') {
    drawEnergy(x, obs.y);
  } else if (obs.type === 'skate') {
    drawSkate(x, obs.y);
  }
}

function drawCone(x, y) {
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x + 3, y + 28, 28, 6, 0, 0, Math.PI*2);
  ctx.fill();

  // 콘 본체 그라데이션
  const coneGrad = ctx.createLinearGradient(x - 28, y, x + 28, y);
  coneGrad.addColorStop(0, '#c24500');
  coneGrad.addColorStop(0.5, '#ff7a1f');
  coneGrad.addColorStop(1, '#c24500');

  ctx.fillStyle = coneGrad;
  ctx.beginPath();
  ctx.moveTo(x, y - 32);
  ctx.lineTo(x - 28, y + 25);
  ctx.lineTo(x + 28, y + 25);
  ctx.closePath();
  ctx.fill();

  // 광택 하이라이트
  ctx.fillStyle = 'rgba(255, 220, 180, 0.5)';
  ctx.beginPath();
  ctx.moveTo(x - 5, y - 28);
  ctx.lineTo(x - 12, y + 20);
  ctx.lineTo(x - 8, y + 20);
  ctx.lineTo(x - 1, y - 28);
  ctx.closePath();
  ctx.fill();

  // 흰 반사 띠
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x - 23, y - 5, 46, 9);
  // 띠 상단 그림자
  ctx.fillStyle = 'rgba(180, 80, 0, 0.4)';
  ctx.fillRect(x - 23, y + 3, 46, 2);

  // 베이스
  const baseGrad = ctx.createLinearGradient(x - 30, 0, x + 30, 0);
  baseGrad.addColorStop(0, '#7a2a00');
  baseGrad.addColorStop(0.5, '#a83800');
  baseGrad.addColorStop(1, '#7a2a00');
  ctx.fillStyle = baseGrad;
  roundRect(x - 32, y + 22, 64, 8, 2);
  ctx.fill();

  // 콘 끝 (작은 깜빡임)
  const now = performance.now();
  const tipGlow = (Math.sin(now * 0.005 + x) + 1) / 2;
  ctx.fillStyle = `rgba(255, 220, 100, ${0.4 + tipGlow * 0.4})`;
  ctx.beginPath();
  ctx.arc(x, y - 30, 3, 0, Math.PI*2);
  ctx.fill();

  // 외곽선
  ctx.strokeStyle = 'rgba(120, 40, 0, 0.8)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y - 32);
  ctx.lineTo(x - 28, y + 25);
  ctx.lineTo(x + 28, y + 25);
  ctx.closePath();
  ctx.stroke();
}

function drawBoss(x, y, avoided) {
  // x, y는 더 이상 사용 안 함 (lane 무시) — 화면 전체 가로 장벽
  ctx.save();
  if (avoided) ctx.globalAlpha = 0.4;

  const cx = W / 2;
  const cy = y; // y만 활용 (낙하 위치)
  const barW = W - 20; // 화면 전체 너비 - 약간 여백
  const barH = 70;

  // === 그림자 (몸 아래) ===
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(cx + 5, cy + barH/2 + 10, barW/2 * 0.85, 12, 0, 0, Math.PI*2);
  ctx.fill();

  // === 몸통 (옆으로 누운 둥글둥글한 게을킹 포즈) ===
  const bodyColor = avoided ? '#888' : '#d4a574';
  const bodyDark = avoided ? '#555' : '#a07845';

  // 몸통 메인 (둥근 직사각형)
  ctx.fillStyle = bodyColor;
  roundRect(cx - barW/2, cy - barH/2, barW, barH, 35);
  ctx.fill();

  // 배 흰색 (게을킹 배)
  ctx.fillStyle = avoided ? '#aaa' : '#f0d8b8';
  roundRect(cx - barW/2 + 60, cy - barH/2 + 15, barW - 120, barH - 30, 20);
  ctx.fill();

  // === 양팔 (좌우 끝으로 뻗은 게을킹 손) ===
  ctx.fillStyle = bodyColor;
  // 왼손
  ctx.beginPath();
  ctx.arc(cx - barW/2 + 15, cy, 28, 0, Math.PI*2);
  ctx.fill();
  // 오른손
  ctx.beginPath();
  ctx.arc(cx + barW/2 - 15, cy, 28, 0, Math.PI*2);
  ctx.fill();
  // 손가락 (3개씩, 양쪽)
  ctx.fillStyle = bodyDark;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(cx - barW/2 + 8, cy - 12 + i * 12, 5, 0, Math.PI*2);
    ctx.arc(cx + barW/2 - 8, cy - 12 + i * 12, 5, 0, Math.PI*2);
    ctx.fill();
  }

  // === 외곽선 ===
  ctx.strokeStyle = bodyDark;
  ctx.lineWidth = 2.5;
  roundRect(cx - barW/2, cy - barH/2, barW, barH, 35);
  ctx.stroke();

  // === 감독 얼굴 (중앙에 배치) ===
  const faceX = cx;
  const faceY = cy - 5;
  const faceR = 30;

  // 얼굴 베이스
  ctx.fillStyle = avoided ? '#999' : '#e8b888';
  ctx.beginPath();
  ctx.arc(faceX, faceY, faceR, 0, Math.PI*2);
  ctx.fill();

  // 머리카락 (옆머리 + 위)
  ctx.fillStyle = avoided ? '#444' : '#2a1a0a';
  ctx.beginPath();
  ctx.arc(faceX, faceY - 8, faceR, Math.PI * 1.05, Math.PI * 1.95);
  ctx.fill();
  // 옆머리 디테일
  ctx.beginPath();
  ctx.arc(faceX - 24, faceY - 5, 8, 0, Math.PI*2);
  ctx.arc(faceX + 24, faceY - 5, 8, 0, Math.PI*2);
  ctx.fill();

  // 눈썹 (화남)
  ctx.strokeStyle = avoided ? '#333' : '#1a0a00';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(faceX - 16, faceY - 3);
  ctx.lineTo(faceX - 5, faceY);
  ctx.moveTo(faceX + 16, faceY - 3);
  ctx.lineTo(faceX + 5, faceY);
  ctx.stroke();

  // 눈
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(faceX - 10, faceY + 4, 3, 0, Math.PI*2);
  ctx.arc(faceX + 10, faceY + 4, 3, 0, Math.PI*2);
  ctx.fill();

  // 입 (벌리고 호통)
  ctx.fillStyle = '#5a1010';
  ctx.beginPath();
  ctx.ellipse(faceX, faceY + 16, 8, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 호루라기 (회피 안된 상태에서만)
  if (!avoided) {
    ctx.fillStyle = '#c0c0c0';
    ctx.beginPath();
    ctx.arc(faceX + 25, faceY + 14, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 호루라기 줄
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(faceX + 18, faceY + 14);
    ctx.lineTo(faceX + 10, faceY + 8);
    ctx.stroke();
  }

  // === 경고 화살표 (점프 유도, 회피 전에만) ===
  if (!avoided) {
    const arrowY = cy - barH/2 - 18;
    const pulse = (Math.sin(performance.now() * 0.008) + 1) / 2;
    ctx.fillStyle = `rgba(255, 60, 60, ${0.6 + pulse * 0.4})`;
    ctx.beginPath();
    ctx.moveTo(cx, arrowY);
    ctx.lineTo(cx - 12, arrowY - 14);
    ctx.lineTo(cx + 12, arrowY - 14);
    ctx.closePath();
    ctx.fill();
    // "JUMP!" 텍스트
    ctx.fillStyle = `rgba(255, 60, 60, ${0.7 + pulse * 0.3})`;
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('JUMP!', cx, arrowY - 22);
    ctx.textAlign = 'start';
  }

  ctx.restore();
}

// 둥근 사각형 그리기 헬퍼
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// 닌텐도식 두꺼운 외곽선 텍스트
function drawComicText(x, y, text, size, fillColor, strokeColor, strokeWidth) {
  ctx.font = `900 ${size}px "Noto Sans KR", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = strokeWidth;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fillColor;
  ctx.fillText(text, x, y);
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

// 드리블 화면 전용 캐릭터 (정면 + 스틱 좌우 스윙)
function drawPlayerDribble(x, y, dir, timeSinceHit) {
  const now = performance.now();
  const swingT = Math.max(0, Math.min(1, timeSinceHit / 150));
  const swingPower = Math.sin(swingT * Math.PI);
  const breath = Math.sin(now * 0.005) * 1.5;
  const charShake = swingPower * 3;

  ctx.save();
  ctx.translate(x + charShake * dir * -0.3, y + breath);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(0, 60, 50, 11, 0, 0, Math.PI*2);
  ctx.fill();

  // === 스틱 (좌우 스윙) ===
  const stickAngle = dir * (0.6 + swingPower * 0.6);
  ctx.save();
  ctx.translate(0, 20);
  ctx.rotate(stickAngle);
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(0, -40);
  ctx.lineTo(0, 70);
  ctx.stroke();
  ctx.strokeStyle = '#e08a4a';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(0, -40);
  ctx.lineTo(0, 70);
  ctx.stroke();
  ctx.fillStyle = '#0a1228';
  ctx.fillRect(-4, -40, 8, 20);
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 14;
  ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.moveTo(0, 70);
  ctx.lineTo(28, 82);
  ctx.stroke();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(2, 70);
  ctx.lineTo(25, 81);
  ctx.stroke();
  ctx.restore();

  // === 몸통 ===
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 3.5;
  ctx.fillStyle = '#1e5fd4';
  ctx.beginPath();
  ctx.moveTo(-30, 15);
  ctx.quadraticCurveTo(-36, 40, -30, 58);
  ctx.lineTo(30, 58);
  ctx.quadraticCurveTo(36, 40, 30, 15);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(-28, 28);
  ctx.lineTo(28, 28);
  ctx.lineTo(28, 40);
  ctx.lineTo(-28, 40);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#1e5fd4';
  ctx.font = '900 12px "Noto Sans KR", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('WEST', 0, 38);
  ctx.fillStyle = '#1e5fd4';
  ctx.beginPath();
  ctx.arc(-30, 18, 12, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(30, 18, 12, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  // === 헬멧 ===
  const helmetY = -22;
  ctx.fillStyle = '#1e5fd4';
  ctx.beginPath();
  ctx.arc(0, helmetY, 32, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#4d9fff';
  ctx.beginPath();
  ctx.ellipse(-10, helmetY - 12, 14, 7, -0.4, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-30, helmetY - 4);
  ctx.quadraticCurveTo(0, helmetY - 10, 30, helmetY - 4);
  ctx.stroke();

  ctx.fillStyle = '#fdd9a8';
  ctx.beginPath();
  ctx.ellipse(0, helmetY + 6, 17, 13, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1.8;
  for (let i=0; i<3; i++) {
    ctx.beginPath();
    ctx.moveTo(-16, helmetY + i*6);
    ctx.lineTo(16, helmetY + i*6);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(-6, helmetY - 4);
  ctx.lineTo(-6, helmetY + 16);
  ctx.moveTo(6, helmetY - 4);
  ctx.lineTo(6, helmetY + 16);
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-8, helmetY + 3, 3.5, 0, Math.PI*2);
  ctx.arc(8, helmetY + 3, 3.5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(-7 + dir, helmetY + 3.5, 2.3, 0, Math.PI*2);
  ctx.arc(9 + dir, helmetY + 3.5, 2.3, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-6 + dir, helmetY + 2.5, 0.9, 0, Math.PI*2);
  ctx.arc(10 + dir, helmetY + 2.5, 0.9, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(-2, helmetY + 11, 2, 0, Math.PI);
  ctx.arc(2, helmetY + 11, 2, 0, Math.PI);
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.font = '900 9px "Noto Sans KR", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('W', 0, helmetY - 14);
  ctx.textAlign = 'start';

  ctx.restore();
}

// 아이스링크 페인트 라인 그리기
function drawRinkLine(y, line) {
  const type = line.type;
  const color = line.color;

  if (type === 'goal') {
    // 골 라인: 빨강 얇은 선
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  } else if (type === 'blue') {
    // 블루 라인: 두꺼운 파랑
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(0, y - 14, W, 28);
    ctx.globalAlpha = 1;
  } else if (type === 'center') {
    // 센터 라인: 빨강 두꺼운 선 (실선)
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(0, y - 10, W, 20);
    ctx.globalAlpha = 1;
  } else if (type === 'faceoff') {
    // 페이스오프 서클: 큰 빨강 동그라미 + 중앙 점
    // 좌측 페이스오프
    const leftX = W * 0.25;
    const rightX = W * 0.75;
    const r = 90;

    ctx.strokeStyle = color;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(leftX, y, r, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(rightX, y, r, 0, Math.PI*2);
    ctx.stroke();

    // 중앙 점
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(leftX, y, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(rightX, y, 7, 0, Math.PI*2);
    ctx.fill();

    // 페이스오프 라인 마크 (T자 모양)
    ctx.lineWidth = 3;
    ctx.strokeStyle = color;
    [leftX, rightX].forEach(cx => {
      // 위쪽 마크
      ctx.beginPath();
      ctx.moveTo(cx - 14, y - 26);
      ctx.lineTo(cx - 14, y - 14);
      ctx.lineTo(cx + 14, y - 14);
      ctx.lineTo(cx + 14, y - 26);
      ctx.stroke();
      // 아래쪽 마크
      ctx.beginPath();
      ctx.moveTo(cx - 14, y + 26);
      ctx.lineTo(cx - 14, y + 14);
      ctx.lineTo(cx + 14, y + 14);
      ctx.lineTo(cx + 14, y + 26);
      ctx.stroke();
    });
  } else if (type === 'crease') {
    // 골 크리스: 파란색 반원 페인트 영역 (작은 골리 영역)
    const cx = W / 2;
    const r = 95;

    // 푸른 페인트 채움
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.arc(cx, y, r, 0, Math.PI, false);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    // 빨강 외곽선
    ctx.strokeStyle = '#cc1f3a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, y, r, 0, Math.PI, false);
    ctx.stroke();

    // 골 라인 (반원 끝과 연결)
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(cx - r, y);
    ctx.moveTo(cx + r, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function drawSkate(x, y) {
  const now = performance.now();
  const float = Math.sin(now * 0.005) * 5;
  const yPos = y + float;
  const rotation = Math.sin(now * 0.004) * 0.18;

  ctx.save();
  ctx.translate(x, yPos);
  ctx.rotate(rotation);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(3, 32, 28, 7, 0, 0, Math.PI*2);
  ctx.fill();

  // === 강한 황금 글로우 오라 ===
  const glowR = 50 + Math.sin(now * 0.006) * 8;
  const glowGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, glowR);
  glowGrad.addColorStop(0, 'rgba(255, 215, 0, 0.8)');
  glowGrad.addColorStop(0.4, 'rgba(255, 215, 0, 0.4)');
  glowGrad.addColorStop(1, 'rgba(255, 215, 0, 0)');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.arc(0, 0, glowR, 0, Math.PI*2);
  ctx.fill();

  // === 스케이트화 부츠 ===
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 3;
  // 부츠 본체 (검정 + 흰색 디테일)
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.moveTo(-22, -12);
  ctx.quadraticCurveTo(-26, -16, -22, -22);
  ctx.lineTo(-10, -22);
  ctx.quadraticCurveTo(-4, -28, 8, -26);
  ctx.lineTo(20, -16);
  ctx.quadraticCurveTo(24, -10, 22, -2);
  ctx.lineTo(22, 8);
  ctx.quadraticCurveTo(20, 14, 14, 14);
  ctx.lineTo(-18, 14);
  ctx.quadraticCurveTo(-22, 10, -22, 4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 부츠 위 흰 디테일 (라이닝)
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(-18, -18);
  ctx.lineTo(8, -22);
  ctx.lineTo(16, -14);
  ctx.lineTo(-16, -10);
  ctx.closePath();
  ctx.fill();

  // 끈 (지그재그)
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(-10, -4);
  ctx.lineTo(0, -8);
  ctx.lineTo(-8, -12);
  ctx.lineTo(6, -16);
  ctx.lineTo(-2, -20);
  ctx.stroke();
  // 끈 구멍
  ctx.fillStyle = '#666';
  for (let i=0; i<5; i++) {
    ctx.beginPath();
    ctx.arc(-10 + i*4, -6 - i*3, 1.2, 0, Math.PI*2);
    ctx.fill();
  }

  // === 스케이트 날 (황금색, 빛남) ===
  // 날 본체
  ctx.fillStyle = '#ffd700';
  ctx.strokeStyle = '#0a1228';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-26, 14);
  ctx.lineTo(26, 14);
  ctx.lineTo(28, 22);
  ctx.lineTo(24, 28);
  ctx.lineTo(-24, 28);
  ctx.lineTo(-28, 22);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 날 하이라이트
  ctx.fillStyle = '#ffe066';
  ctx.fillRect(-22, 17, 44, 3);

  // 날 글로우 (강한 빛 효과)
  ctx.save();
  ctx.shadowColor = '#ffd700';
  ctx.shadowBlur = 20;
  ctx.strokeStyle = 'rgba(255, 220, 50, 0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-26, 14);
  ctx.lineTo(26, 14);
  ctx.stroke();
  ctx.restore();

  // === 별 스파클 (주변 회전) ===
  for (let i=0; i<4; i++) {
    const angle = (now * 0.003 + i * Math.PI / 2);
    const sx = Math.cos(angle) * 36;
    const sy = Math.sin(angle) * 22;
    const sparkleAlpha = (Math.sin(now * 0.01 + i) + 1) / 2;
    ctx.fillStyle = `rgba(255, 255, 255, ${sparkleAlpha})`;
    ctx.strokeStyle = `rgba(255, 215, 0, ${sparkleAlpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    drawStarPath(sx, sy, 4, 3.5, 1.5);
    ctx.fill();
    ctx.stroke();
  }

  // "SUPER" 작은 라벨
  ctx.fillStyle = '#ffd700';
  ctx.font = '900 9px "Noto Sans KR", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('SUPER', 0, -30);
  ctx.textAlign = 'start';

  ctx.restore();
}

function drawEnergy(x, y) {
  const now = performance.now();
  // 부유 애니메이션
  const float = Math.sin(now * 0.004) * 4;
  const yPos = y + float;
  // 회전
  const rotation = Math.sin(now * 0.003) * 0.15;

  ctx.save();
  ctx.translate(x, yPos);
  ctx.rotate(rotation);

  // === 그림자 ===
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(3, 32, 22, 6, 0, 0, Math.PI*2);
  ctx.fill();

  // === 글로우 오라 (배경) ===
  const glowR = 38 + Math.sin(now * 0.005) * 4;
  const glowGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, glowR);
  glowGrad.addColorStop(0, 'rgba(0, 255, 136, 0.6)');
  glowGrad.addColorStop(0.5, 'rgba(0, 255, 136, 0.25)');
  glowGrad.addColorStop(1, 'rgba(0, 255, 136, 0)');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.arc(0, 0, glowR, 0, Math.PI*2);
  ctx.fill();

  // === 캔 본체 (메탈릭 그라데이션) ===
  const bodyGrad = ctx.createLinearGradient(-18, 0, 18, 0);
  bodyGrad.addColorStop(0, '#022a14');
  bodyGrad.addColorStop(0.15, '#0a4a20');
  bodyGrad.addColorStop(0.5, '#1a8030');
  bodyGrad.addColorStop(0.85, '#0a4a20');
  bodyGrad.addColorStop(1, '#022a14');
  ctx.fillStyle = bodyGrad;
  roundRect(-18, -30, 36, 60, 4);
  ctx.fill();

  // 메탈릭 광택 (밝은 하이라이트)
  const shineGrad = ctx.createLinearGradient(-18, 0, 18, 0);
  shineGrad.addColorStop(0, 'rgba(255,255,255,0)');
  shineGrad.addColorStop(0.3, 'rgba(255,255,255,0.15)');
  shineGrad.addColorStop(0.5, 'rgba(255,255,255,0.4)');
  shineGrad.addColorStop(0.7, 'rgba(255,255,255,0.15)');
  shineGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shineGrad;
  roundRect(-18, -30, 36, 60, 4);
  ctx.fill();

  // 상하단 메탈 캡
  ctx.fillStyle = '#aaaaaa';
  roundRect(-18, -30, 36, 5, 2);
  ctx.fill();
  roundRect(-18, 25, 36, 5, 2);
  ctx.fill();
  // 캡 디테일
  ctx.fillStyle = '#666';
  ctx.fillRect(-18, -25, 36, 1);
  ctx.fillRect(-18, 25, 36, 1);

  // === M 마크 (큰 글자, 발광) ===
  ctx.save();
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#00ff88';
  ctx.font = 'bold 26px "Noto Sans KR", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('M', 0, 0);
  ctx.restore();

  // 외곽선 글로우
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 16;
  ctx.strokeStyle = 'rgba(0, 255, 136, 0.8)';
  ctx.lineWidth = 1.5;
  roundRect(-18, -30, 36, 60, 4);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 작은 별 스파클 (주변)
  for (let i=0; i<3; i++) {
    const angle = (now * 0.002 + i * Math.PI * 2 / 3);
    const sx = Math.cos(angle) * 26;
    const sy = Math.sin(angle) * 26;
    const sparkleAlpha = (Math.sin(now * 0.008 + i) + 1) / 2;
    ctx.fillStyle = `rgba(255, 255, 255, ${sparkleAlpha * 0.8})`;
    ctx.beginPath();
    ctx.arc(sx, sy, 1.5, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

function renderParticles() {
  for (const p of STATE.particles) {
    const alpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// 슈팅 미션 렌더링
// ============================================================
function renderShooting() {
  const sh = STATE.shoot;
  const now = performance.now();

  // === 배경 그라데이션 (스타디움 분위기) ===
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#0a1228');
  bgGrad.addColorStop(0.4, '#142048');
  bgGrad.addColorStop(0.55, '#0a1228');
  bgGrad.addColorStop(1, '#050816');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 관중 실루엣 (상단 배경, 어두운 검정 점들)
  if (!STATE.crowdDots) {
    STATE.crowdDots = [];
    for (let i = 0; i < 80; i++) {
      STATE.crowdDots.push({
        x: Math.random() * W,
        y: 20 + Math.random() * 50,
        size: 6 + Math.random() * 4,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }
  for (const dot of STATE.crowdDots) {
    const wave = Math.sin(now * 0.002 + dot.phase) * 2;
    ctx.fillStyle = '#020410';
    ctx.beginPath();
    ctx.arc(dot.x, dot.y + wave, dot.size, 0, Math.PI*2);
    ctx.fill();
    // 머리 위 살짝 하이라이트
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.beginPath();
    ctx.arc(dot.x, dot.y + wave - 2, dot.size * 0.4, 0, Math.PI*2);
    ctx.fill();
  }

  // 관중석 라인 (어두운 가로 띠)
  ctx.fillStyle = 'rgba(2, 4, 16, 0.8)';
  ctx.fillRect(0, 0, W, 80);
